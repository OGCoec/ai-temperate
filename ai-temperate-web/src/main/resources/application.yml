# Spring Boot 框架级配置。
spring:
  # 未显式指定运行环境时加载本地开发配置，生产部署必须指定独立 Profile。
  profiles:
    # 默认同时启用本地开发与 HTTPS，缺少证书环境变量时拒绝启动而不回退 HTTP。
    default: ${SPRING_PROFILES_DEFAULT:local-dev,local-https}

  # 应用基础信息配置。
  application:
    # 应用名称用于日志、监控和服务识别。
    name: ai-temperate

  # Spring AI 普通 OpenAI Starter 只作为本机 CLIProxyAPI 的协议适配器，不启用内置 ChatMemory。
  ai:
    # 模型选择只启用普通 OpenAI Chat，其他自动配置全部显式关闭。
    model:
      # 部署开启推理时必须设置为 openai，默认 none 避免未配置密钥时创建外部客户端。
      chat: ${AI_INFERENCE_SPRING_CHAT_MODEL:none}
      # 本项目不使用 OpenAI Embedding，禁止 Starter 创建额外模型 Bean。
      embedding: none
      # 本项目不使用 OpenAI Image，禁止 Starter 创建额外模型 Bean。
      image: none
      # 音频模型选择分别关闭语音合成和转录，避免无意连接外部服务。
      audio:
        # 本项目不使用 OpenAI Speech 模型。
        speech: none
        # 本项目不使用 OpenAI Transcription 模型。
        transcription: none
      # 本项目不使用 OpenAI Moderation，禁止 Starter 创建额外模型 Bean。
      moderation: none
    # Spring AI 重试只保留首次调用，避免流式生成被自动重复并造成重复输出或计费。
    retry:
      # 一次尝试包含首次请求本身，因此不会执行额外重试。
      max-attempts: 1
    # 普通 OpenAI Starter 的连接参数全部由服务端环境提供，浏览器不会读取该节点。
    openai:
      # CLIProxyAPI 代理密钥只从环境变量读取，不配置明文默认值。
      api-key: ${CLI_PROXY_API_KEY:}
      # 基础地址不包含 v1，具体 Chat Completions 路径由下方配置统一追加。
      base-url: ${AI_INFERENCE_CLI_PROXY_BASE_URL:http://127.0.0.1:8317}
      # 聊天调用默认项只声明所有兼容模型都支持的稳定参数。
      chat:
        # 普通 Starter 固定调用 CLIProxyAPI 的 OpenAI 兼容 Chat Completions 路径。
        completions-path: /v1/chat/completions
        # 请求级选项由业务层覆盖模型和最大输出，本节点只固定流式用量与存储语义。
        options:
          # 一个发送动作只生成一个候选回答。
          n: 1
          # CLIProxyAPI 和上游不得为本项目请求建立服务端持久化会话。
          store: false
          # 流式选项用于要求最后一个 SSE 数据片携带最终 Usage。
          stream-options:
            # 最终 Usage 是本项目实际结算的权威 Token 来源。
            include-usage: true

  # Spring AOP 代理方式用于兼容不可继承的 final Service 实现类。
  aop:
    # 事务 Service 统一通过业务接口调用，默认使用 JDK 接口代理并允许环境变量覆盖。
    proxy-target-class: ${SPRING_AOP_PROXY_TARGET_CLASS:false}

  # Servlet 上传边界用于在读取请求体前限制管理员模型图标文件大小。
  servlet:
    # Multipart 请求限制只负责传输层保护，业务层仍按真实图片字节执行独立校验。
    multipart:
      # 单个本地图标文件最大允许两 MiB。
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:2MB}
      # Multipart 总请求额外预留名称、描述和边界编码空间。
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:3MB}

  # 邮件发送默认使用 Gmail SMTP，部署环境仍可通过 MAIL_* 覆盖为其他服务商。
  mail:
    # SMTP 主机默认指向 Gmail，允许环境变量切换部署目标。
    host: ${MAIL_HOST:smtp.gmail.com}
    # SMTP 端口默认使用 Gmail STARTTLS 端口。
    port: ${MAIL_PORT:587}
    # SMTP 用户名优先读取通用变量，并兼容 shopping 项目的 Gmail 用户名变量。
    username: ${MAIL_USERNAME:${GOOGLE_MAIL_USERNAME:}}
    # SMTP 密码优先读取通用变量，并兼容 Gmail 应用专用密码变量。
    password: ${MAIL_PASSWORD:${GOOGLE_MAIL_SECRET}}
    # JavaMail 扩展属性用于 Gmail SMTP 的认证、超时和代理设置。
    properties:
      # JavaMail 的 mail 命名空间用于下发 SMTP 细项。
      mail:
        # SMTP 子配置对应 JavaMail 的 mail.smtp 属性前缀。
        smtp:
          # Gmail SMTP 要求启用账号密码认证。
          auth: ${MAIL_SMTP_AUTH:true}
          # SMTP 连接超时时间防止外部网络阻塞发送线程。
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
          # SMTP 读取超时时间防止服务端无响应时无限等待。
          timeout: ${MAIL_SMTP_TIMEOUT_MS:10000}
          # SMTP 写入超时时间防止网络异常时卡住邮件发送。
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}
          # SOCKS 代理配置用于沿用旧项目本地代理出口。
          socks:
            # 邮件代理主机支持环境变量切换代理出口。
            host: ${MAIL_PROXY_HOST:127.0.0.1}
            # 邮件代理端口沿用旧项目本地代理端口。
            port: ${MAIL_PROXY_PORT:7892}
          # STARTTLS 配置用于 Gmail SMTP 587 端口加密传输。
          starttls:
            # Gmail SMTP 587 端口需要启用 STARTTLS。
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  # PostgreSQL 单主库连接配置。
  datasource:
    # JDBC 地址默认连接本机 5431 端口的 ai_temperate 单主库。
    url: ${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5431/ai_temperate}
    # PostgreSQL 用户名支持环境变量覆盖。
    username: ${POSTGRES_USERNAME:postgres}
    # PostgreSQL 密码必须由部署环境提供，禁止生产默认值。
    password: ${POSTGRES_PASSWORD}
    # 显式使用 PostgreSQL JDBC 驱动避免错误驱动推断。
    driver-class-name: org.postgresql.Driver
    # HikariCP 连接池等待和 PostgreSQL JDBC 网络读取必须有界，避免 Rabbit 消息长期停留在 Unacked。
    hikari:
      # 获取数据库连接最多等待十秒，连接池耗尽时尽快失败并交给上层有限重试。
      connection-timeout: ${POSTGRES_POOL_CONNECTION_TIMEOUT_MS:10000}
      # 连接存活检查最多等待五秒，避免失效连接长期占用消费线程。
      validation-timeout: ${POSTGRES_POOL_VALIDATION_TIMEOUT_MS:5000}
      # PostgreSQL JDBC 驱动属性用于约束建立连接和读取服务端响应的网络等待。
      data-source-properties:
        # PostgreSQL 建立 TCP 连接最多等待五秒；驱动该属性的单位是秒。
        connectTimeout: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:5}
        # PostgreSQL socket 读取最多等待三十秒，半开连接不得占用 Rabbit 消息直到 ACK 超时。
        socketTimeout: ${POSTGRES_SOCKET_TIMEOUT_SECONDS:30}
        # TCP Keepalive 用于更早发现已失效的数据库网络连接。
        tcpKeepAlive: ${POSTGRES_TCP_KEEP_ALIVE:true}

  # Spring Data 基础设施配置。
  data:
    # Redis 单实例连接配置。
    redis:
      # Redis 主机支持环境变量覆盖。
      host: ${REDIS_HOST:127.0.0.1}
      # Redis 端口支持环境变量覆盖。
      port: ${REDIS_PORT:6378}
      # Redis 逻辑数据库编号支持环境变量覆盖。
      database: ${REDIS_DATABASE:0}
      # Redis 密码必须由部署环境提供，禁止生产默认值。
      password: ${REDIS_PASSWORD}

  # RabbitMQ AMQP 连接与可靠投递配置。
  rabbitmq:
    # RabbitMQ 主机支持环境变量覆盖。
    host: ${RABBITMQ_HOST:127.0.0.1}
    # RabbitMQ 默认使用项目约定的 5673 AMQP 端口。
    port: ${RABBITMQ_PORT:5673}
    # RabbitMQ 用户名支持环境变量覆盖。
    username: ${RABBITMQ_USERNAME:guest}
    # RabbitMQ 密码必须由部署环境提供，禁止生产默认值。
    password: ${RABBITMQ_PASSWORD}
    # RabbitMQ 虚拟主机支持环境变量隔离业务资源。
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # 启用关联式发布确认以观测 Broker 接收结果。
    publisher-confirm-type: correlated
    # 启用无法路由消息的返回机制。
    publisher-returns: true
    # RabbitTemplate 发布行为配置。
    template:
      # 即时消息默认启用无法路由返回；验证码延迟消息由自定义 mandatory 表达式按 x-delay 关闭该语义。
      mandatory: true
    # RabbitMQ 消费监听容器配置。
    listener:
      # 默认使用 SimpleMessageListenerContainer。
      simple:
        # 消费者必须在本地业务处理成功后手动确认消息。
        acknowledge-mode: manual
        # 消费失败后禁止无限重新入队。
        default-requeue-rejected: false

# MyBatis 持久化框架配置。
mybatis:
  # Mapper XML 使用 classpath* 扫描所有模块资源，确保 mapper 子模块中的 SQL 映射被加载。
  mapper-locations: classpath*:mapper/**/*.xml

# 应用业务、Web 异步响应与安全边界配置。
app:
  # Web 层异步响应使用独立有界执行器承载 SSE 等阻塞 Servlet 写出任务。
  web:
    # MVC 异步边界显式配置线程和外层超时，禁止退回不适合生产长连接的默认执行器。
    mvc-async:
      # 常驻十六个核心线程用于吸收普通并发流式响应。
      core-pool-size: ${WEB_MVC_ASYNC_CORE_POOL_SIZE:16}
      # 最多一百六十个线程覆盖一百二十八条 AI 流并为其他异步响应预留余量。
      max-pool-size: ${WEB_MVC_ASYNC_MAX_POOL_SIZE:160}
      # 零队列使用直接交接，禁止长连接在内存中隐藏排队。
      queue-capacity: 0
      # 空闲核心线程六十秒后允许回收，降低低流量实例的线程占用。
      keep-alive: ${WEB_MVC_ASYNC_KEEP_ALIVE:60s}
      # 外层 MVC 时限为十六分钟，必须严格晚于十五分钟模型总期限。
      timeout: ${WEB_MVC_ASYNC_TIMEOUT:16m}

  # 七档普通用户套餐共享首次使用起滚动七天的额度规则，所有数值均使用最小计费单位。
  membership-quota:
    # 套餐额度周期固定为七天，配置偏离该周期时应用拒绝启动。
    period: ${MEMBERSHIP_QUOTA_PERIOD:P7D}
    # 各等级额度必须完整覆盖后端枚举，防止新增等级静默获得错误额度。
    limits:
      # Free 每周总额度为五十，对应五千个最小计费单位。
      FREE: ${MEMBERSHIP_QUOTA_FREE_LIMIT_MINOR:5000}
      # Go 每周总额度为五百，对应五万个最小计费单位。
      GO: ${MEMBERSHIP_QUOTA_GO_LIMIT_MINOR:50000}
      # Education 每周总额度为八百，对应八万个最小计费单位。
      EDU: ${MEMBERSHIP_QUOTA_EDU_LIMIT_MINOR:80000}
      # Team 每周总额度为一千八百，对应十八万个最小计费单位。
      TEAM: ${MEMBERSHIP_QUOTA_TEAM_LIMIT_MINOR:180000}
      # Plus 每周总额度为两千，对应二十万个最小计费单位。
      PLUS: ${MEMBERSHIP_QUOTA_PLUS_LIMIT_MINOR:200000}
      # Pro 每周总额度为一万，对应一百万个最小计费单位。
      PRO: ${MEMBERSHIP_QUOTA_PRO_LIMIT_MINOR:1000000}
      # MAX 在普通用户前端显示为 Ultra，每周总额度为五万。
      MAX: ${MEMBERSHIP_QUOTA_MAX_LIMIT_MINOR:5000000}

  # 普通用户资料使用每用户一个 Redis String 加速读取，PostgreSQL 始终是事实来源。
  user-profile-cache:
    # 内部用户 ID 使用独立 AES-256-KWP 密钥生成稳定 Key 标识，禁止配置默认明文密钥。
    id-encryption-key-base64: ${USER_PROFILE_CACHE_ID_AES_KEY_BASE64:}
    # 用户资料正向缓存随机 TTL 下界固定为五分钟。
    minimum-ttl: ${USER_PROFILE_CACHE_MINIMUM_TTL:5m}
    # 用户资料正向缓存随机 TTL 上界固定为十五分钟。
    maximum-ttl: ${USER_PROFILE_CACHE_MAXIMUM_TTL:15m}

  # 启用 AI 模型使用固定聚合 Key 和整体 AES-256-GCM 密文缓存，PostgreSQL 始终是事实来源。
  ai-model-cache:
    # 独立三十二字节规范 Base64 密钥必须由部署环境提供，禁止复用其他安全域密钥。
    encryption-key-base64: ${AI_MODEL_CACHE_ENCRYPTION_KEY_BASE64:}
    # 加密快照随机 TTL 下界固定为五分钟，避免所有实例同时失效。
    minimum-ttl: ${AI_MODEL_CACHE_MINIMUM_TTL:5m}
    # 加密快照随机 TTL 上界固定为十五分钟，限制短暂旧值窗口。
    maximum-ttl: ${AI_MODEL_CACHE_MAXIMUM_TTL:15m}
    # 单个聚合快照最多加载五百个启用模型，超限时拒绝生成 BigKey。
    max-models: ${AI_MODEL_CACHE_MAX_MODELS:500}

  # 普通用户 AI 会话上下文、租约、流片合并和通用附件安全边界配置。
  ai-conversation:
    # Redis 会话上下文从首次创建或真实重建起固定保存七十二小时。
    context-ttl: ${AI_CONVERSATION_CONTEXT_TTL:72h}
    # 单个会话生成租约使用短期限并在 SSE 心跳期间尽力续租。
    inflight-lease-ttl: ${AI_CONVERSATION_INFLIGHT_LEASE_TTL:45s}
    # 压缩单飞租约覆盖一次受限内部压缩调用。
    compaction-lease-ttl: ${AI_CONVERSATION_COMPACTION_LEASE_TTL:5m}
    # 二百五十毫秒批次仅供关闭默认开关后的异步 Generation 回滚链路使用，直接 MVC SSE 不经过该定时器。
    stream-flush-interval: ${AI_CONVERSATION_STREAM_FLUSH_INTERVAL:250ms}
    # Redis 终态草稿和异步回滚链路按四 KiB UTF-8 安全边界拆成独立 Hash 字段。
    stream-flush-bytes: ${AI_CONVERSATION_STREAM_FLUSH_BYTES:4096}
    # PostgreSQL 会话消息重建和压缩读取每批最多五百条。
    context-page-size: ${AI_CONVERSATION_CONTEXT_PAGE_SIZE:500}
    # 单个会话 Hash 达到五千字段前必须重建，防止形成 Redis BigKey。
    max-hash-fields: ${AI_CONVERSATION_MAX_HASH_FIELDS:5000}
    # 单个会话 Hash 达到一千字段时开始触发临时上下文压缩。
    compaction-hash-field-threshold: ${AI_CONVERSATION_COMPACTION_HASH_FIELD_THRESHOLD:1000}
    # 单用户同时活跃生成上限为四个不同会话。
    max-concurrent-per-user: ${AI_CONVERSATION_MAX_CONCURRENT_PER_USER:4}
    # 全部应用实例共享的活跃生成总上限为一百二十八。
    max-concurrent-global: ${AI_CONVERSATION_MAX_CONCURRENT_GLOBAL:128}
    # 图片缺少厂商精确计数规则时采用保守固定 Token 估算。
    image-estimated-tokens: ${AI_CONVERSATION_IMAGE_ESTIMATED_TOKENS:2048}
    # 预计下一轮达到上下文窗口百分之八十时调度异步压缩。
    pre-compaction-percent: ${AI_CONVERSATION_PRE_COMPACTION_PERCENT:80}
    # RESERVED 超时判定在最大流时长之外额外保留两分钟安全缓冲。
    reservation-safety-buffer: ${AI_CONVERSATION_RESERVATION_SAFETY_BUFFER:2m}
    # 过期 RESERVED 扫描每分钟运行一次且不执行自动退款。
    reconciliation-scan-interval: ${AI_CONVERSATION_RECONCILIATION_SCAN_INTERVAL:1m}
    # 单次最多把五百条过期 RESERVED 标记为待人工对账。
    reconciliation-batch-size: ${AI_CONVERSATION_RECONCILIATION_BATCH_SIZE:500}
    # 历史系统失败自动补退默认关闭，核对候选数量和金额后再显式开启。
    historical-system-failure-auto-refund-enabled: ${AI_CONVERSATION_HISTORICAL_SYSTEM_FAILURE_AUTO_REFUND_ENABLED:false}
    # 直接 MVC SSE 的显式 Stop 协调配置不承载模型正文。
    direct-response-cancellation:
      # 多实例生产默认启用 RabbitMQ Owner 路由；仅测试或单实例诊断可显式关闭并依赖 Redis 意图与浏览器 Abort。
      rabbit-enabled: ${AI_CONVERSATION_DIRECT_RESPONSE_RABBIT_ENABLED:true}
    # Responses 联网搜索默认关闭，只有完成本地 8317 受限探测后才允许部署环境开启。
    web-search:
      # 总开关关闭时 AUTO 和 REQUIRED 请求会在连接上游前受控失败。
      enabled: ${AI_CONVERSATION_WEB_SEARCH_ENABLED:false}
      # 专用客户端只允许在既有 CLIProxyAPI 基础地址下调用固定相对路径。
      responses-path: ${AI_CONVERSATION_WEB_SEARCH_RESPONSES_PATH:/v1/responses}
    # 后台异步 Generation 保留为回滚路径，普通用户默认使用直接 MVC POST SSE。
    async-generation:
      # 新链路总开关默认关闭；需要回滚到异步 Generation 时显式设为 true。
      enabled: ${AI_CONVERSATION_ASYNC_GENERATION_ENABLED:false}
      # 每个生产实例必须使用部署系统注入的唯一标识以定向路由取消命令。
      instance-id: ${AI_CONVERSATION_INSTANCE_ID:local-single-instance}
      # SSE 失联允许三十秒重连，期间模型生成不得被观察者断开取消。
      detach-grace: ${AI_CONVERSATION_DETACH_GRACE:30s}
      # 十五秒 SSE 心跳用于感知真正断开的浏览器或 App 连接，不触发数据库轮询。
      observer-heartbeat: ${AI_CONVERSATION_OBSERVER_HEARTBEAT:15s}
      # 已计费终态保留二十四小时后才允许进行有界批量清理。
      terminal-retention: ${AI_CONVERSATION_TERMINAL_RETENTION:24h}
      # 单实例默认使用四个有界 Worker 消费者且每个消费者一次只处理一个生成。
      worker-consumers: ${AI_CONVERSATION_WORKER_CONSUMERS:4}
      # 单次模型 Worker 最长运行十五分钟，Broker ACK 超时必须至少再多五分钟。
      max-worker-duration: ${AI_CONVERSATION_MAX_WORKER_DURATION:15m}
    # 全生命周期诊断默认关闭，只在受控复现取消、结算或页面刷新延迟时开启。
    lifecycle-diagnostics:
      # 生命周期日志总开关关闭时不输出请求、终态、事务或缓存诊断事件。
      enabled: ${AI_CONVERSATION_LIFECYCLE_DIAGNOSTICS_ENABLED:false}
      # 稳定采样比例默认是零；问题复现期间可临时设为一并在结束后恢复。
      sample-rate: ${AI_CONVERSATION_LIFECYCLE_DIAGNOSTICS_SAMPLE_RATE:0}
    # 流式时序诊断永久保留但默认关闭，关闭时不创建统计窗口或输出诊断日志。
    stream-diagnostics:
      # 诊断总开关仅允许在受控排查期间显式开启，修改后需要重启后端。
      enabled: ${AI_CONVERSATION_STREAM_DIAGNOSTICS_ENABLED:false}
      # Usage 公共 ID 的稳定采样比例默认是零，避免普通运行产生高基数诊断。
      sample-rate: ${AI_CONVERSATION_STREAM_DIAGNOSTICS_SAMPLE_RATE:0}
      # 每个边界最多每秒输出一次时间窗口汇总，防止逐片日志放大。
      window: ${AI_CONVERSATION_STREAM_DIAGNOSTICS_WINDOW:1s}
      # 单个窗口累计一百个信号时允许提前输出一次汇总。
      log-every-chunks: ${AI_CONVERSATION_STREAM_DIAGNOSTICS_LOG_EVERY_CHUNKS:100}
      # 连续五秒没有信号后才进入集中爆发候选判定。
      silence-threshold: ${AI_CONVERSATION_STREAM_DIAGNOSTICS_SILENCE_THRESHOLD:5s}
      # 静默后的二百五十毫秒用于统计集中到达的信号数量。
      burst-window: ${AI_CONVERSATION_STREAM_DIAGNOSTICS_BURST_WINDOW:250ms}
      # 候选窗口达到二百个信号时输出一次安全 WARN。
      burst-chunks: ${AI_CONVERSATION_STREAM_DIAGNOSTICS_BURST_CHUNKS:200}
    # 服务端可信系统提示不接受前端覆盖。
    system-prompt: ${AI_CONVERSATION_SYSTEM_PROMPT:你是一个可靠的 AI 助手，请依据已有上下文回答并明确不确定信息。}
    # 会话通用附件使用独立配置组，所有对象路径仍只能由服务端工厂构造。
    attachments:
      # 会话附件沿用现有公共读 Bucket，真实 Bucket 名允许按部署环境覆盖。
      bucket: ${AI_CONVERSATION_ATTACHMENT_OSS_BUCKET:ihaveaplan}
      # 阿里云 OSS SDK 使用的区域标识必须与 Bucket 所在区域一致。
      region: ${AI_CONVERSATION_ATTACHMENT_OSS_REGION:us-west-1}
      # OSS SDK 只连接部署侧配置的 HTTPS Endpoint。
      endpoint: ${AI_CONVERSATION_ATTACHMENT_OSS_ENDPOINT:https://oss-us-west-1.aliyuncs.com}
      # 正式附件完整公网 URL 由固定 HTTPS 基础地址与服务端 Object Key 组成。
      public-base-url: ${AI_CONVERSATION_ATTACHMENT_PUBLIC_BASE_URL:https://ihaveaplan.oss-us-west-1.aliyuncs.com}
      # 客户端 PUT 预签名默认十分钟有效且只允许写入单个私有临时对象。
      presigned-put-ttl: ${AI_CONVERSATION_ATTACHMENT_PRESIGNED_PUT_TTL:10m}
      # 私有临时附件交给单次模型请求的 GET 签名默认十分钟有效且禁止缓存。
      signed-get-ttl: ${AI_CONVERSATION_ATTACHMENT_SIGNED_GET_TTL:10m}
      # 单个用户附件和单个模型生成媒体最大一百 MiB。
      max-file-bytes: ${AI_CONVERSATION_ATTACHMENT_MAX_FILE_BYTES:104857600}
      # 单条用户输入或模型输出最多保留八个附件。
      max-files-per-message: ${AI_CONVERSATION_ATTACHMENT_MAX_FILES:8}
      # 单条用户输入或模型输出的附件总大小最多二百 MiB。
      max-total-bytes-per-message: ${AI_CONVERSATION_ATTACHMENT_MAX_TOTAL_BYTES:209715200}
      # 单个正式对象复制或上传失败时最多执行三次有界尝试。
      finalization-attempts: ${AI_CONVERSATION_ATTACHMENT_FINALIZATION_ATTEMPTS:3}
      # H5 与 Android 客户端直接上传 OSS 时最多并行三个 PUT。
      client-upload-concurrency: ${AI_CONVERSATION_ATTACHMENT_UPLOAD_CONCURRENCY:3}
      # 音频每开始一 MiB 使用四千零九十六 Token 进行上下文安全估算。
      audio-tokens-per-mib: ${AI_CONVERSATION_AUDIO_TOKENS_PER_MIB:4096}
      # 每个音频附件额外增加二百五十六 Token 固定安全开销。
      audio-fixed-tokens: ${AI_CONVERSATION_AUDIO_FIXED_TOKENS:256}
      # 视频每开始一 MiB 使用八千一百九十二 Token 进行上下文安全估算。
      video-tokens-per-mib: ${AI_CONVERSATION_VIDEO_TOKENS_PER_MIB:8192}
      # 每个视频附件额外增加二百五十六 Token 固定安全开销。
      video-fixed-tokens: ${AI_CONVERSATION_VIDEO_FIXED_TOKENS:256}
      # 下载模型生成 HTTPS 媒体时建立连接最多等待两秒。
      media-connect-timeout: ${AI_CONVERSATION_MEDIA_CONNECT_TIMEOUT:2s}
      # 下载模型生成 HTTPS 媒体时读取内容最多等待十秒。
      media-read-timeout: ${AI_CONVERSATION_MEDIA_READ_TIMEOUT:10s}
      # 模型媒体下载最多跟随两次并逐跳重新校验的 HTTPS 重定向。
      media-max-redirects: ${AI_CONVERSATION_MEDIA_MAX_REDIRECTS:2}
    # 发送动作幂等摘要使用独立安全域密钥，数据库不保存原始 UUID。
    security:
      # HMAC-SHA256 密钥必须是至少三十二字节的规范 Base64。
      idempotency-hmac-key-base64: ${AI_CONVERSATION_IDEMPOTENCY_HMAC_KEY_BASE64}

  # CLIProxyAPI 用户推理开关和服务层超时配置。
  ai-inference:
    # 用户模型生成只允许访问服务端固定的本机 CLIProxyAPI。
    cli-proxy:
      # 推理默认关闭，部署确认 8317 和计费链路后才显式启用。
      enabled: ${AI_INFERENCE_CLI_PROXY_ENABLED:false}
      # 用户推理固定访问服务端配置的 CLIProxyAPI 基础地址，版本路径由 Spring AI Chat 配置追加。
      base-url: ${AI_INFERENCE_CLI_PROXY_BASE_URL:http://127.0.0.1:8317}
      # 启用推理时普通代理密钥必须非空，关闭时允许为空。
      api-key: ${CLI_PROXY_API_KEY:}
      # 单次上游模型流从订阅开始最多持续十五分钟，期间心跳或模型片段都不会重置总时限。
      max-stream-duration: ${AI_INFERENCE_MAX_STREAM_DURATION:15m}

  # AI 模型历史搜索词元回填只允许在受控维护启动中显式开启。
  ai-model-token-backfill:
    # 默认关闭回填；开启后按五百条批次执行，任一失败都会阻止应用完成启动。
    enabled: ${AI_MODEL_TOKEN_BACKFILL_ENABLED:false}

  # Cloudflare Worker 同源代理通过请求级 HMAC 证明浏览器实际访问的外部主机。
  edge-proxy:
    # 本地默认关闭验签；生产切换期显式使用 OPTIONAL，稳定后必须设置为 REQUIRED。
    mode: ${EDGE_PROXY_MODE:DISABLED}
    # 启用验签时必须提供独立规范 Base64 密钥，禁止复用 JWT、会话或缓存密钥。
    hmac-secret-base64: ${EDGE_PROXY_HMAC_SECRET_BASE64:}
    # 签名只接受三十秒内的请求，限制捕获签名后的重放窗口。
    max-clock-skew: ${EDGE_PROXY_MAX_CLOCK_SKEW:30s}

  # Redis-only 网络风险、外部 IP 情报、PreAuth 与 WAF Challenge 配置。
  network-risk:
    # 本地默认关闭，首次生产上线使用 OBSERVE，完成验收后切换为 ENFORCE。
    mode: ${NETWORK_RISK_MODE:DISABLED}
    # OBSERVE 或 ENFORCE 必须提供至少三十二字节的规范 Base64 HMAC 密钥；DISABLED 不提供默认密钥。
    hmac-secret-base64: ${NETWORK_RISK_HMAC_SECRET_BASE64:}
    # OBSERVE 或 ENFORCE 必须提供独立 Base64 主密钥；DISABLED 只使用不持久化的进程内随机材料。
    ip2-location-api-key-encryption-key-base64: ${IP2LOCATION_API_KEY_ENCRYPTION_KEY_BASE64:}
    # IP2Location 风险查询固定使用官方 HTTPS 起点，测试环境可以覆盖为受控桩服务。
    ip2-location-base-url: ${IP2LOCATION_RISK_BASE_URL:https://api.ip2location.io/}
    # iPing 仅作为 IP2Location 缺少评分时的 HTTPS 降级端点。
    iping-base-url: ${IPING_RISK_BASE_URL:https://api.iping.cc/v1/query}
    # 默认启用 iPing 降级；明确关闭时直接进入本地 BIN 与默认分。
    iping-enabled: ${IPING_RISK_ENABLED:true}
    # 缓存未命中的整条外部查询链最多占用八秒，供应商共享该预算。
    lookup-timeout: ${NETWORK_RISK_LOOKUP_TIMEOUT:8s}
    # 完整第三方结果缓存六小时，并由实现增加正负百分之二十抖动。
    positive-cache-ttl: ${NETWORK_RISK_POSITIVE_CACHE_TTL:6h}
    # 本地 BIN 或默认六十分只缓存十分钟，以便较快重试第三方。
    fallback-cache-ttl: ${NETWORK_RISK_FALLBACK_CACHE_TTL:10m}
    # 同一 IP 的跨实例 single-flight 锁只覆盖一次外部查询预算。
    single-flight-ttl: ${NETWORK_RISK_SINGLE_FLIGHT_TTL:9s}
    # 单实例最多允许三十二个缓存未命中的外部风险查询并发。
    max-concurrent-lookups: ${NETWORK_RISK_MAX_CONCURRENT_LOOKUPS:32}
    # 未登录 PreAuth 每次有效业务请求获得三十分钟滑动期限。
    anonymous-pre-auth-ttl: ${NETWORK_RISK_ANONYMOUS_PREAUTH_TTL:30m}
    # 登录成功关联后的 PreAuth 每次有效业务请求获得六小时滑动期限。
    authenticated-pre-auth-ttl: ${NETWORK_RISK_AUTHENTICATED_PREAUTH_TTL:6h}
    # 一次性 WAF Challenge 引用五分钟后失效。
    challenge-ttl: ${NETWORK_RISK_CHALLENGE_TTL:5m}
    # Challenge 成功证明在当前决策上下文中最多保留三十分钟。
    challenge-verified-ttl: ${NETWORK_RISK_CHALLENGE_VERIFIED_TTL:30m}
    # 不可能旅行至少比较相距两百公里的两个可信位置，允许按部署环境覆盖但不属于 Secret。
    impossible-travel-minimum-distance-km: ${NETWORK_RISK_IMPOSSIBLE_TRAVEL_MINIMUM_DISTANCE_KM:200}
    # 不可能旅行只比较最近二十四小时内的可信观测。
    impossible-travel-window: ${NETWORK_RISK_IMPOSSIBLE_TRAVEL_WINDOW:24h}
    # 动态 BLOCK 决策在相同 PreAuth 上保留十分钟，避免高风险请求立即重复计算。
    temporary-block-ttl: ${NETWORK_RISK_TEMPORARY_BLOCK_TTL:10m}
    # WebRTC 客户端探测只定义有界协议参数和加密材料，后端不会向 STUN 发起请求。
    web-rtc:
      # 浏览器与 Android 系统 WebView 最多等待十五秒完成 ICE 候选收集。
      probe-timeout: ${WEBRTC_PROBE_TIMEOUT:15s}
      # STUN 地址按固定优先顺序下发，服务端校验客户端上报结果的并集。
      stun-urls:
        # Google STUN 作为第一个全局候选来源。
        - "${WEBRTC_STUN_GOOGLE_URL:stun:stun.l.google.com:19302}"
        # Cloudflare STUN 作为第二个全局候选来源。
        - "${WEBRTC_STUN_CLOUDFLARE_URL:stun:stun.cloudflare.com:3478}"
        # Twilio STUN 作为第三个全局候选来源。
        - "${WEBRTC_STUN_TWILIO_URL:stun:global.stun.twilio.com:3478}"
        # Nextcloud STUN 作为第四个全局候选来源。
        - "${WEBRTC_STUN_NEXTCLOUD_URL:stun:stun.nextcloud.com:3478}"
      # 单次报告最多接受八个规范化公网 IPv4 或 IPv6 地址。
      max-reported-ips: ${WEBRTC_MAX_REPORTED_IPS:8}
      # OBSERVE 或 ENFORCE 必须提供独立三十二字节规范 Base64 密钥，禁止复用其他安全域密钥。
      ip-encryption-key-base64: ${WEBRTC_IP_ENCRYPTION_KEY_BASE64:}

  # 安全属性统一绑定并在启动时执行 Jakarta Validation。
  security:
    # 部署环境使用 LOCAL、TEST 或 PROD 白名单值。
    env: ${APP_ENV:PROD}
    # JWT 签名配置只提供基础 codec 密钥，不定义登录会话。
    jwt:
      # JWT HS256 密钥必须由环境提供规范 Base64，解码后至少 32 字节。
      secret-base64: ${AUTH_JWT_SECRET_BASE64}
    # PII Redis Key 标识使用的 HMAC 配置。
    hmac:
      # HMAC 密钥必须由环境提供规范 Base64，解码后至少 32 字节。
      secret-base64: ${AUTH_HMAC_SECRET_BASE64}
    # Cloudflare Turnstile 服务端校验配置。
    turnstile:
      # Turnstile Site Key 必须由部署环境提供。
      site-key: ${TURNSTILE_SITE_KEY}
      # Turnstile Secret Key 必须由部署环境提供，禁止默认值。
      secret-key: ${TURNSTILE_SECRET_KEY}
      # Turnstile 返回的 hostname 只能命中显式白名单。
      allowed-hosts: ${TURNSTILE_ALLOWED_HOSTS}
    # H5 认证与流程 Cookie 使用彼此隔离且不可降级的安全策略。
    cookies:
      # 正式切换后变量必须删除并保持 Host-only；仅迁移或回滚窗口允许临时覆盖父域。
      domain: ${AUTH_COOKIE_DOMAIN:}
      # Access Token Cookie 只发送到 API 路径并禁止脚本读取。
      access:
        # Access Token Cookie 必须只通过 HTTPS 传输。
        secure: ${AUTH_ACCESS_COOKIE_SECURE:true}
        # Access Token Cookie 必须保持 HttpOnly 以阻止 JavaScript 读取。
        http-only: ${AUTH_ACCESS_COOKIE_HTTP_ONLY:true}
        # Access Token Cookie 固定使用严格同站策略。
        same-site: ${AUTH_ACCESS_COOKIE_SAME_SITE:STRICT}
        # Access Token Cookie 仅作用于全部 API 路径。
        path: ${AUTH_ACCESS_COOKIE_PATH:/api}
      # Refresh Token Cookie 只允许会话端点自动携带。
      refresh:
        # Refresh Token Cookie 必须只通过 HTTPS 传输。
        secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
        # Refresh Token Cookie 必须保持 HttpOnly 以阻止 JavaScript 读取。
        http-only: ${AUTH_REFRESH_COOKIE_HTTP_ONLY:true}
        # Refresh Token Cookie 固定使用严格同站策略。
        same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:STRICT}
        # Refresh Token Cookie 仅作用于刷新、恢复和退出端点。
        path: ${AUTH_REFRESH_COOKIE_PATH:/api/auth/session}
      # CSRF Cookie 允许 H5 读取并复制到受控请求头。
      csrf:
        # CSRF Cookie 必须只通过 HTTPS 传输。
        secure: ${AUTH_CSRF_COOKIE_SECURE:true}
        # CSRF Cookie 必须允许 JavaScript 读取，禁止改成 HttpOnly。
        http-only: ${AUTH_CSRF_COOKIE_HTTP_ONLY:false}
        # CSRF Cookie 固定使用严格同站策略。
        same-site: ${AUTH_CSRF_COOKIE_SAME_SITE:STRICT}
        # CSRF Cookie 作用于整个站点以保护全部写请求。
        path: ${AUTH_CSRF_COOKIE_PATH:/}
      # 注册流程 Token Cookie 只允许注册端点自动携带。
      register-flow:
        # 注册流程 Token Cookie 必须只通过 HTTPS 传输。
        secure: ${AUTH_REGISTER_FLOW_COOKIE_SECURE:true}
        # 注册流程 Token Cookie 必须保持 HttpOnly 以阻止 JavaScript 读取。
        http-only: ${AUTH_REGISTER_FLOW_COOKIE_HTTP_ONLY:true}
        # 注册流程 Token Cookie 固定使用严格同站策略。
        same-site: ${AUTH_REGISTER_FLOW_COOKIE_SAME_SITE:STRICT}
        # 注册流程 Token Cookie 仅作用于注册端点。
        path: ${AUTH_REGISTER_FLOW_COOKIE_PATH:/api/auth/register}
      # 注册 Turnstile Challenge Cookie 仅用于 H5 刷新后由服务端恢复流程。
      register-challenge:
        # 注册 Challenge Cookie 必须只通过 HTTPS 传输。
        secure: ${AUTH_REGISTER_CHALLENGE_COOKIE_SECURE:true}
        # 注册 Challenge Cookie 必须保持 HttpOnly 以避免脚本持久化读取。
        http-only: ${AUTH_REGISTER_CHALLENGE_COOKIE_HTTP_ONLY:true}
        # 注册 Challenge Cookie 固定使用严格同站策略。
        same-site: ${AUTH_REGISTER_CHALLENGE_COOKIE_SAME_SITE:STRICT}
        # 注册 Challenge Cookie 仅作用于注册端点。
        path: ${AUTH_REGISTER_CHALLENGE_COOKIE_PATH:/api/auth/register}
      # 找回密码流程 Token Cookie 只允许找回密码端点自动携带。
      password-reset-flow:
        # 找回密码流程 Token Cookie 必须只通过 HTTPS 传输。
        secure: ${AUTH_PASSWORD_RESET_FLOW_COOKIE_SECURE:true}
        # 找回密码流程 Token Cookie 必须保持 HttpOnly 以阻止 JavaScript 读取。
        http-only: ${AUTH_PASSWORD_RESET_FLOW_COOKIE_HTTP_ONLY:true}
        # 找回密码流程 Token Cookie 固定使用严格同站策略。
        same-site: ${AUTH_PASSWORD_RESET_FLOW_COOKIE_SAME_SITE:STRICT}
        # 找回密码流程 Token Cookie 仅作用于找回密码端点。
        path: ${AUTH_PASSWORD_RESET_FLOW_COOKIE_PATH:/api/auth/password-reset}
      # 找回密码一次性完成凭证 Cookie 只允许最终重置端点携带。
      password-reset-forget:
        # 找回密码一次性完成凭证 Cookie 必须只通过 HTTPS 传输。
        secure: ${AUTH_PASSWORD_RESET_FORGET_COOKIE_SECURE:true}
        # 找回密码一次性完成凭证 Cookie 必须保持 HttpOnly 以阻止 JavaScript 读取。
        http-only: ${AUTH_PASSWORD_RESET_FORGET_COOKIE_HTTP_ONLY:true}
        # 找回密码一次性完成凭证 Cookie 固定使用严格同站策略。
        same-site: ${AUTH_PASSWORD_RESET_FORGET_COOKIE_SAME_SITE:STRICT}
        # 找回密码一次性完成凭证 Cookie 仅作用于完成端点。
        path: ${AUTH_PASSWORD_RESET_FORGET_COOKIE_PATH:/api/auth/password-reset/complete}
    # 浏览器跨域访问白名单配置。
    cors:
      # 仅允许显式 HTTP(S) Origin，禁止通配符。
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    # 认证与缓存 TTL 边界配置。
    ttl:
      # Access Token 默认使用十分钟生命周期，签发和 Cookie Max-Age 共用该配置。
      access-token: ${AUTH_ACCESS_TOKEN_TTL:10m}
      # 验证码 TTL 默认 5 分钟且限制在 30 秒至 15 分钟。
      verification-code: ${AUTH_VERIFICATION_CODE_TTL:5m}
      # 正向缓存 TTL 默认 10 分钟并限制在 5 至 15 分钟。
      positive-cache: ${AUTH_POSITIVE_CACHE_TTL:10m}
      # 空值缓存 TTL 默认 45 秒并限制在 30 至 60 秒。
      empty-cache: ${AUTH_EMPTY_CACHE_TTL:45s}

  # 单管理员初始化、hCaptcha 登录和六小时会话的安全配置。
  admin:
    # 隐藏管理员 YAML 路径支持部署环境挂载到持久化 Secret 目录。
    config-path: ${ADMIN_CONFIG_PATH:.admin/complete.yaml}
    # 管理员通过 CLIProxyAPI 发现当前网关模型的只读服务端配置。
    ai-model-discovery:
      # CLIProxyAPI 模型发现客户端配置，地址与密钥禁止由浏览器传入。
      cli-proxy:
        # 功能默认关闭，部署确认本机网关和普通代理密钥后才显式启用。
        enabled: ${CLI_PROXY_MODEL_DISCOVERY_ENABLED:false}
        # 后端固定访问本机 CLIProxyAPI，不向浏览器暴露 8317 端口。
        base-url: ${CLI_PROXY_BASE_URL:http://127.0.0.1:8317}
        # 普通代理 Bearer 密钥只从环境变量读取，不配置任何明文默认值。
        api-key: ${CLI_PROXY_API_KEY:}
        # 建立本机连接允许等待的最长时间。
        connect-timeout: ${CLI_PROXY_CONNECT_TIMEOUT:2s}
        # 读取模型列表允许等待的最长时间。
        read-timeout: ${CLI_PROXY_READ_TIMEOUT:5s}
        # 单次最多接受五百个模型，超过上限拒绝整个响应。
        max-models: ${CLI_PROXY_MAX_MODELS:500}
    # 管理员 Flow 和会话标识使用独立规范 Base64 HMAC 密钥，禁止复用 JWT 或普通用户 HMAC。
    session-hmac-secret-base64: ${ADMIN_SESSION_HMAC_SECRET_BASE64}
    # 管理员不透明会话每次成功访问后滑动续期六小时。
    session-ttl: ${ADMIN_SESSION_TTL:6h}
    # 单管理员最多允许十个同时在线设备，超过上限拒绝新会话。
    max-sessions: ${ADMIN_MAX_SESSIONS:10}
    # 管理员首次注册 Flow 固定十分钟有效。
    registration-flow-ttl: ${ADMIN_REGISTRATION_FLOW_TTL:10m}
    # 管理员登录 hCaptcha Flow 固定十分钟有效。
    login-flow-ttl: ${ADMIN_LOGIN_FLOW_TTL:10m}
    # 管理员 API 只允许显式 HTTPS Origin 携带凭据访问。
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:https://admin.niko000o.site}
    # hCaptcha 服务端 Siteverify 配置。
    hcaptcha:
      # hCaptcha Site Key 是允许返回管理员前端的公开标识。
      site-key: ${HCAPTCHA_SITE_KEY}
      # hCaptcha Secret Key 只能由部署环境提供，禁止返回前端或写入日志。
      secret-key: ${HCAPTCHA_SECRET_KEY}
      # hCaptcha 响应域名必须命中管理员站点白名单。
      allowed-hosts: ${HCAPTCHA_ALLOWED_HOSTS:admin.niko000o.site}
      # 建立 hCaptcha HTTPS 连接最多等待八秒。
      connect-timeout: ${HCAPTCHA_CONNECT_TIMEOUT:8s}
      # 等待 hCaptcha HTTP 响应和正文最多八秒。
      response-timeout: ${HCAPTCHA_RESPONSE_TIMEOUT:8s}
      # hCaptcha 一次性挑战最多接受两分钟前签发的响应。
      max-challenge-age: ${HCAPTCHA_MAX_CHALLENGE_AGE:2m}
    # 管理员 H5 Cookie 使用独立名称和路径，禁止与普通用户会话混用。
    cookies:
      # 正式切换后变量必须删除并保持 Host-only；仅回滚窗口允许临时覆盖敏感 Cookie 父域。
      domain: ${ADMIN_COOKIE_DOMAIN:}
      # 正式切换后由同源 Worker 保证可读，迁移窗口可临时保留旧 CSRF 父域。
      csrf-domain: ${ADMIN_CSRF_COOKIE_DOMAIN:}
      # 管理员会话 Cookie 仅发送到管理员 API。
      session:
        # 管理员会话 Cookie 必须只通过 HTTPS 传输。
        secure: ${ADMIN_SESSION_COOKIE_SECURE:true}
        # 原始管理员 Token 禁止 JavaScript 读取。
        http-only: ${ADMIN_SESSION_COOKIE_HTTP_ONLY:true}
        # 管理员会话固定使用严格同站策略。
        same-site: ${ADMIN_SESSION_COOKIE_SAME_SITE:Strict}
        # 管理员会话 Cookie 只作用于管理员 API。
        path: ${ADMIN_SESSION_COOKIE_PATH:/api/admin}
      # 管理员会话双提交 CSRF Cookie 允许 H5 读取。
      csrf:
        # 管理员 CSRF Cookie 必须只通过 HTTPS 传输。
        secure: ${ADMIN_CSRF_COOKIE_SECURE:true}
        # 双提交 CSRF Cookie 必须允许 JavaScript 读取。
        http-only: ${ADMIN_CSRF_COOKIE_HTTP_ONLY:false}
        # 管理员 CSRF Cookie 固定使用严格同站策略。
        same-site: ${ADMIN_CSRF_COOKIE_SAME_SITE:Strict}
        # 管理员 CSRF Cookie 作用于整个站点以保护退出等写请求。
        path: ${ADMIN_CSRF_COOKIE_PATH:/}
      # 管理员首次注册 Token 与 Challenge Cookie 配置。
      register-flow:
        # 管理员注册 Flow Cookie 必须只通过 HTTPS 传输。
        secure: ${ADMIN_REGISTER_FLOW_COOKIE_SECURE:true}
        # 注册 Token 与 Challenge 禁止 JavaScript 读取。
        http-only: ${ADMIN_REGISTER_FLOW_COOKIE_HTTP_ONLY:true}
        # 管理员注册 Flow 固定使用严格同站策略。
        same-site: ${ADMIN_REGISTER_FLOW_COOKIE_SAME_SITE:Strict}
        # 管理员注册 Flow Cookie 仅发送到注册端点。
        path: ${ADMIN_REGISTER_FLOW_COOKIE_PATH:/api/admin/auth/register}
      # 管理员注册 Flow 双提交 CSRF Cookie 配置。
      register-csrf:
        # 管理员注册 CSRF Cookie 必须只通过 HTTPS 传输。
        secure: ${ADMIN_REGISTER_CSRF_COOKIE_SECURE:true}
        # 注册 Flow CSRF 必须允许前端复制到受控请求头。
        http-only: ${ADMIN_REGISTER_CSRF_COOKIE_HTTP_ONLY:false}
        # 管理员注册 CSRF 固定使用严格同站策略。
        same-site: ${ADMIN_REGISTER_CSRF_COOKIE_SAME_SITE:Strict}
        # 管理员页面必须能读取注册 CSRF Cookie；认证 Flow Token 仍由独立 HttpOnly 路径隔离。
        path: ${ADMIN_REGISTER_CSRF_COOKIE_PATH:/}
      # 管理员登录 Flow Token 与 Challenge Cookie 配置。
      login-flow:
        # 管理员登录 Flow Cookie 必须只通过 HTTPS 传输。
        secure: ${ADMIN_LOGIN_FLOW_COOKIE_SECURE:true}
        # 登录 Flow Token 与 Challenge 禁止 JavaScript 读取。
        http-only: ${ADMIN_LOGIN_FLOW_COOKIE_HTTP_ONLY:true}
        # 管理员登录 Flow 固定使用严格同站策略。
        same-site: ${ADMIN_LOGIN_FLOW_COOKIE_SAME_SITE:Strict}
        # 管理员登录 Flow Cookie 仅发送到登录端点。
        path: ${ADMIN_LOGIN_FLOW_COOKIE_PATH:/api/admin/auth/login}
      # 管理员登录 Flow 双提交 CSRF Cookie 配置。
      login-csrf:
        # 管理员登录 CSRF Cookie 必须只通过 HTTPS 传输。
        secure: ${ADMIN_LOGIN_CSRF_COOKIE_SECURE:true}
        # 登录 Flow CSRF 必须允许前端复制到受控请求头。
        http-only: ${ADMIN_LOGIN_CSRF_COOKIE_HTTP_ONLY:false}
        # 管理员登录 CSRF 固定使用严格同站策略。
        same-site: ${ADMIN_LOGIN_CSRF_COOKIE_SAME_SITE:Strict}
        # 管理员页面必须能读取登录 CSRF Cookie；认证 Flow Token 仍由独立 HttpOnly 路径隔离。
        path: ${ADMIN_LOGIN_CSRF_COOKIE_PATH:/}
    # 管理员批量邮箱检查使用固定本机代理、有限重试和 Redis 权威任务。
    mail-inspection:
      # OAuth HTTP CONNECT 与 IMAP SOCKS 共用唯一的本机 mixed 代理。
      proxy:
        # 代理只允许回环地址，禁止把敏感邮箱流量转发到局域网主机。
        host: ${ADMIN_MAIL_INSPECTION_PROXY_HOST:127.0.0.1}
        # 固定 7897 端口，不探测或回退 7892。
        port: ${ADMIN_MAIL_INSPECTION_PROXY_PORT:7897}
      # Microsoft 公共客户端 refresh token 交换配置。
      oauth:
        # 公共租户 OAuth v2 端点允许隔离测试覆盖为本地桩地址。
        token-uri: ${ADMIN_MAIL_INSPECTION_TOKEN_URI:https://login.microsoftonline.com/common/oauth2/v2.0/token}
        # OAuth 只申请 Outlook IMAP 委托权限和离线访问。
        scope: ${ADMIN_MAIL_INSPECTION_SCOPE:https://outlook.office.com/IMAP.AccessAsUser.All offline_access}
        # 专用 Reactor Netty 连接池最多保留十六条连接。
        max-connections: ${ADMIN_MAIL_INSPECTION_OAUTH_MAX_CONNECTIONS:16}
        # 全部任务共享最多八个并发 OAuth 请求。
        concurrency: ${ADMIN_MAIL_INSPECTION_OAUTH_CONCURRENCY:8}
        # 建立 OAuth 代理连接最多等待五秒。
        connect-timeout: ${ADMIN_MAIL_INSPECTION_OAUTH_CONNECT_TIMEOUT:5s}
        # 单次 OAuth 响应最多等待十二秒。
        response-timeout: ${ADMIN_MAIL_INSPECTION_OAUTH_RESPONSE_TIMEOUT:12s}
        # 首次请求加两次重试，总尝试次数固定不超过三次。
        max-attempts: ${ADMIN_MAIL_INSPECTION_OAUTH_MAX_ATTEMPTS:3}
        # 普通临时错误第一次重试前等待一秒，后续指数增加。
        initial-backoff: ${ADMIN_MAIL_INSPECTION_OAUTH_INITIAL_BACKOFF:1s}
        # 普通退避加入百分之二十随机抖动以避免同步重试。
        jitter: ${ADMIN_MAIL_INSPECTION_OAUTH_JITTER:0.2}
        # 供应商 Retry-After 单次最多接受三十秒。
        max-retry-after: ${ADMIN_MAIL_INSPECTION_OAUTH_MAX_RETRY_AFTER:30s}
        # 单条凭证从 OAuth 到 IMAP 的完整处理最多占用一百二十秒。
        credential-timeout: ${ADMIN_MAIL_INSPECTION_CREDENTIAL_TIMEOUT:120s}
      # Outlook IMAPS/XOAUTH2 阻塞调用的虚拟线程隔离配置。
      imap:
        # Outlook IMAP 主机保持官方固定端点。
        host: ${ADMIN_MAIL_INSPECTION_IMAP_HOST:imap-mail.outlook.com}
        # IMAPS 使用标准 993 端口并支持隔离测试覆盖。
        port: ${ADMIN_MAIL_INSPECTION_IMAP_PORT:993}
        # 全部任务共享最多四个真实 IMAP 连接。
        concurrency: ${ADMIN_MAIL_INSPECTION_IMAP_CONCURRENCY:4}
        # 建立 IMAP 连接最多等待十秒。
        connect-timeout: ${ADMIN_MAIL_INSPECTION_IMAP_CONNECT_TIMEOUT:10s}
        # 单次 IMAP 读取或写入最多等待二十秒。
        read-timeout: ${ADMIN_MAIL_INSPECTION_IMAP_READ_TIMEOUT:20s}
        # 单个邮箱的完整 IMAP 扫描最多持续四十五秒。
        scan-timeout: ${ADMIN_MAIL_INSPECTION_IMAP_SCAN_TIMEOUT:45s}
        # 临时 IMAP I/O 首次加两次重试，总尝试次数不超过三次。
        max-attempts: ${ADMIN_MAIL_INSPECTION_IMAP_MAX_ATTEMPTS:3}
      # Redis 权威任务的容量、批量边界、租约和保留策略。
      job:
        # 单实例同时最多运行两个不同类型任务。
        max-active-jobs: ${ADMIN_MAIL_INSPECTION_MAX_ACTIVE_JOBS:2}
        # 同一检查类型同时最多运行一个任务。
        max-active-jobs-per-type: ${ADMIN_MAIL_INSPECTION_MAX_ACTIVE_JOBS_PER_TYPE:1}
        # 管理员未指定时，每个任务默认使用四个 Rabbit 消费业务额度。
        default-business-concurrency: ${ADMIN_MAIL_INSPECTION_DEFAULT_BUSINESS_CONCURRENCY:4}
        # 单个任务允许申请的业务并发上限固定为六十四，不改变 OAuth 与 IMAP 的全局限制。
        max-business-concurrency: ${ADMIN_MAIL_INSPECTION_MAX_BUSINESS_CONCURRENCY:64}
        # 单行字符数上限阻止分隔符和 Token 造成无界内存占用。
        max-line-chars: ${ADMIN_MAIL_INSPECTION_MAX_LINE_CHARS:12288}
        # 单次 JSON 中凭证文本的 UTF-8 总量不得超过一 MiB。
        max-request-bytes: ${ADMIN_MAIL_INSPECTION_MAX_REQUEST_BYTES:1048576}
        # 活动任务使用十五分钟滑动租约，只有后端租约心跳允许续签。
        active-lease: ${ADMIN_MAIL_INSPECTION_JOB_ACTIVE_LEASE:15m}
        # 完成、失败或废弃任务使用固定十五分钟保留期，普通读取不得续期。
        terminal-retention: ${ADMIN_MAIL_INSPECTION_JOB_TERMINAL_RETENTION:15m}
        # 后端每三十秒批量续签活动任务，浏览器状态不参与租约决策。
        lease-heartbeat-interval: ${ADMIN_MAIL_INSPECTION_JOB_LEASE_HEARTBEAT_INTERVAL:30s}
        # 单个任务最多接收一万行，补齐仅限制 UTF-8 字节数无法约束大量空行的缺口。
        max-credential-lines: ${ADMIN_MAIL_INSPECTION_MAX_CREDENTIAL_LINES:10000}
        # Redis 每个结果 Hash Bucket 固定最多保存三十二行结果。
        result-bucket-size: ${ADMIN_MAIL_INSPECTION_RESULT_BUCKET_SIZE:32}
        # 首次 SSE 快照每批最多发送一百条结果，避免单事件过大。
        snapshot-batch-size: ${ADMIN_MAIL_INSPECTION_SNAPSHOT_BATCH_SIZE:100}
        # Job ID 和幂等 ID 的 Redis Key 使用独立 HMAC 密钥且禁止生产默认值。
        key-hmac-secret-base64: ${ADMIN_MAIL_INSPECTION_JOB_HMAC_SECRET_BASE64}
      # 邮件检查 SSE 连接、心跳和每个管理员会话的并发上限。
      sse:
        # 服务端每十五秒发送心跳并比较 Redis revision 以修复 Pub/Sub 丢失。
        heartbeat-interval: ${ADMIN_MAIL_INSPECTION_SSE_HEARTBEAT_INTERVAL:15s}
        # 客户端四十五秒未收到任何事件时应主动重连。
        idle-reconnect-threshold: ${ADMIN_MAIL_INSPECTION_SSE_IDLE_RECONNECT_THRESHOLD:45s}
        # 单条 SSE 连接最长保持三十分钟，到期后由客户端携带 revision 重建。
        connection-timeout: ${ADMIN_MAIL_INSPECTION_SSE_CONNECTION_TIMEOUT:30m}
        # 每个管理员会话最多允许四条并行 SSE 连接。
        max-connections-per-admin: ${ADMIN_MAIL_INSPECTION_SSE_MAX_CONNECTIONS_PER_ADMIN:4}
      # RabbitMQ 工作消息加密、可靠发布确认和重启恢复扫描配置。
      rabbit:
        # 默认启用 Rabbit 工作调度；隔离单元测试可显式关闭并使用不可用替身，生产任务禁止回退进程内队列。
        enabled: ${ADMIN_MAIL_INSPECTION_RABBIT_ENABLED:true}
        # 邮箱、clientId 与 refresh token 使用独立 AES-256-GCM 密钥保护，生产环境必须显式提供规范 Base64 的三十二字节随机值。
        payload-key-base64: ${ADMIN_MAIL_INSPECTION_RABBIT_AES_KEY_BASE64}
        # 单次 Publisher Confirm 最多等待五秒，超时进入有限发布重试。
        confirm-timeout: ${ADMIN_MAIL_INSPECTION_RABBIT_CONFIRM_TIMEOUT:5s}
        # 每条工作消息连同首次发布最多尝试三次，禁止无限循环发布。
        publish-max-attempts: ${ADMIN_MAIL_INSPECTION_RABBIT_PUBLISH_MAX_ATTEMPTS:3}
        # 发布失败按二百毫秒、五百毫秒和一秒的有界序列退避。
        publish-backoffs: ${ADMIN_MAIL_INSPECTION_RABBIT_PUBLISH_BACKOFFS:200ms,500ms,1s}
        # 终态派发标记每分钟分批回收，避免历史任务持续占用恢复队列。
        marker-cleanup-interval: ${ADMIN_MAIL_INSPECTION_RABBIT_MARKER_CLEANUP_INTERVAL:1m}
        # 单次最多校验五百条标记，避免定时清理长时间占用类型生命周期锁。
        marker-cleanup-batch-size: ${ADMIN_MAIL_INSPECTION_RABBIT_MARKER_CLEANUP_BATCH_SIZE:500}
      # 持久化提交分块、异步派发与残缺任务清理使用独立边界。
      submission:
        # 残缺提交最多保留六小时，期间客户端可使用原幂等键安全补齐。
        incomplete-retention: ${ADMIN_MAIL_INSPECTION_SUBMISSION_INCOMPLETE_RETENTION:6h}
        # 每分钟检查一次超过保留期且仍未完整确认的提交。
        cleanup-interval: ${ADMIN_MAIL_INSPECTION_SUBMISSION_CLEANUP_INTERVAL:1m}
        # 单个分块加密前最多承载一百六十 KiB 凭证数据。
        max-plaintext-chunk-bytes: ${ADMIN_MAIL_INSPECTION_SUBMISSION_MAX_PLAINTEXT_CHUNK_BYTES:163840}
        # 序列化后的完整 Rabbit 消息禁止超过二百五十六 KiB。
        max-message-bytes: ${ADMIN_MAIL_INSPECTION_SUBMISSION_MAX_MESSAGE_BYTES:262144}
        # HTTP 创建阶段最多同时等待八个 Submission Publisher Confirm。
        publish-concurrency: ${ADMIN_MAIL_INSPECTION_SUBMISSION_PUBLISH_CONCURRENCY:8}
        # 单个 Submission Chunk 最多同时派发十六条 Work 消息。
        work-dispatch-concurrency: ${ADMIN_MAIL_INSPECTION_WORK_DISPATCH_CONCURRENCY:16}
      # 只读邮件扫描窗口、正文上限和文件夹优先级。
      scan:
        # OpenAI 与 Kiro 每个文件夹最多读取最近八十封邮件。
        status-fetch-count: ${ADMIN_MAIL_INSPECTION_STATUS_FETCH_COUNT:80}
        # OpenAI 与 Kiro 每个邮箱最多解析三十封候选邮件。
        status-max-candidates: ${ADMIN_MAIL_INSPECTION_STATUS_MAX_CANDIDATES:30}
        # IP2Location 每个文件夹最多读取最近二十封邮件。
        ip2-fetch-count: ${ADMIN_MAIL_INSPECTION_IP2_FETCH_COUNT:20}
        # IP2Location 每个邮箱最多解析二十封候选邮件。
        ip2-max-candidates: ${ADMIN_MAIL_INSPECTION_IP2_MAX_CANDIDATES:20}
        # MIME 提取文本最多保留二十万字符且不会写入任务状态。
        max-body-chars: ${ADMIN_MAIL_INSPECTION_MAX_BODY_CHARS:200000}
        # 垃圾邮件文件夹优先于收件箱，随后再扫描其他可读文件夹。
        folder-order: ${ADMIN_MAIL_INSPECTION_FOLDER_ORDER:Junk Email,INBOX}
      # 三类供应商邮件的候选与限制证据白名单。
      matchers:
        # OpenAI 和 ChatGPT 邮件匹配参数。
        openai:
          # 发送方包含 OpenAI 或 ChatGPT 时视为候选。
          sender-keywords: ${ADMIN_MAIL_INSPECTION_OPENAI_SENDERS:openai,chatgpt}
          # 主题包含 OpenAI 或 ChatGPT 时视为候选。
          subject-keywords: ${ADMIN_MAIL_INSPECTION_OPENAI_SUBJECTS:openai,chatgpt}
          # 这些稳定短语表示找到账号限制证据。
          restricted-phrases: ${ADMIN_MAIL_INSPECTION_OPENAI_RESTRICTED:Your account has been detected,deactivated,deactivating}
        # Kiro 和 AWS 邮件匹配参数。
        kiro:
          # Kiro 候选默认只接受 AWS 官方相关发送方关键字。
          sender-keywords: ${ADMIN_MAIL_INSPECTION_KIRO_SENDERS:amazonaws.com,no-reply@amazonaws.com}
          # Kiro 候选主题使用旧项目确认过的三组关键字。
          subject-keywords: ${ADMIN_MAIL_INSPECTION_KIRO_SUBJECTS:Kiro,Your Kiro Account,Response Required}
          # Kiro 限制短语覆盖可疑活动、暂停、禁用和策略审查。
          restricted-phrases: ${ADMIN_MAIL_INSPECTION_KIRO_RESTRICTED:detected suspicious activity,restricted your ability to use Kiro,requires immediate attention,validate your account details,abuse,suspicious activity,restricted,suspended,disabled,terminated,policy violation,account review}
        # IP2Location 邮件只使用官方域和品牌主题关键字。
        ip2location:
          # 发送方必须包含 IP2Location 官方域才直接命中。
          sender-domain: ${ADMIN_MAIL_INSPECTION_IP2_SENDER_DOMAIN:ip2location.io}
          # 主题包含品牌关键字时也进入候选扫描。
          subject-keyword: ${ADMIN_MAIL_INSPECTION_IP2_SUBJECT_KEYWORD:ip2location}

  # 手机号默认国家识别配置。
  phone-country:
    # 默认启用基于客户端 IP 的国家识别，BIN 不可用时自动降级。
    enabled: ${AUTH_PHONE_COUNTRY_ENABLED:true}
    # IP2Location DB11 IPv6 BIN 文件路径，生产环境应该使用外部绝对路径。
    bin-path: ${AUTH_PHONE_COUNTRY_BIN_PATH:IP2LOCATION-LITE-DB11.IPV6.BIN}
    # 单次手机号国家识别的服务端最大执行时间，超时后返回受控错误。
    lookup-timeout: ${AUTH_PHONE_COUNTRY_LOOKUP_TIMEOUT:8s}
    # 可信代理 CIDR 使用逗号分隔，默认不信任任何代理提供的转发 IP 头。
    trusted-proxy-ranges: ${AUTH_PHONE_COUNTRY_TRUSTED_PROXY_RANGES:}

  # 受保护业务 API 的脱敏访问审计配置。
  access-audit:
    # 默认关闭访问审计；仅在明确需要数据库审计存储时才应启用整条消息链路。
    enabled: false
    # IP HMAC 使用独立 Base64 密钥，禁止复用 JWT、Cookie 或认证缓存密钥。
    hmac-secret-base64: ${ACCESS_AUDIT_HMAC_SECRET_BASE64}
    # 审计记录默认保留三十天，过期数据由有界批量任务清理。
    retention: ${ACCESS_AUDIT_RETENTION:30d}
    # 消费者单批最多处理二百条消息，避免逐条数据库写入和无界批量。
    batch-size: ${ACCESS_AUDIT_BATCH_SIZE:200}
    # 消费者最长等待五百毫秒形成批次，平衡写入吞吐与审计延迟。
    batch-timeout: ${ACCESS_AUDIT_BATCH_TIMEOUT:500ms}
    # 单批数据库事务最多执行十五秒，必须显著短于 RabbitMQ 的消费者 ACK 超时。
    store-timeout-seconds: ${ACCESS_AUDIT_STORE_TIMEOUT_SECONDS:15}
    # 每个清理事务最多删除一千条过期记录。
    cleanup-batch-size: ${ACCESS_AUDIT_CLEANUP_BATCH_SIZE:1000}
    # 每轮清理最多执行五十个独立批次，避免长时间占用数据库。
    cleanup-max-batches: ${ACCESS_AUDIT_CLEANUP_MAX_BATCHES:50}

  # 登录限流与刷新会话的服务层配置。
  auth-session:
    # 会话敏感标识使用独立 HMAC 密钥，缺失时必须启动失败。
    hmac-secret-base64: ${AUTH_SESSION_HMAC_SECRET_BASE64}
    # 固定 Refresh Token 使用三小时滑动空闲有效期，每次成功刷新或会话恢复后重新获得完整三小时，不设置绝对截止时间。
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:3h}
    # 单个用户最多保留十个并发刷新会话。
    max-sessions-per-user: ${AUTH_MAX_SESSIONS_PER_USER:10}
    # 全部撤销操作最多处理一百个会话，防止无界 Lua 工作量。
    absolute-revoke-bound: ${AUTH_ABSOLUTE_REVOKE_BOUND:100}
    # 登录失败仅按安装设备维度计数，本期 IP 只做脱敏审计且不参与计数或封禁。
    login-limit:
      # 密码登录桶和验证码登录桶分别使用固定五分钟窗口。
      window: ${AUTH_LOGIN_FAILURE_WINDOW:5m}
      # 每个独立登录失败桶允许累计前五次失败，第六次触发登录域封禁。
      max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
      # 任一登录失败桶第六次失败后，对该安装设备封禁整个登录域两小时。
      block-duration: ${AUTH_LOGIN_BLOCK_DURATION:2h}

  # 已注册邮箱与手机号计数布隆过滤器的容量、分片和后台构建配置。
  identity-presence-bloom:
    # 是否启用身份 Bloom；关闭时所有认证流程直接回源 PostgreSQL。
    enabled: ${IDENTITY_PRESENCE_BLOOM_ENABLED:true}
    # 每个邮箱或手机号过滤器分别使用一百万个计数器。
    capacity: ${IDENTITY_PRESENCE_BLOOM_CAPACITY:1000000}
    # 每个受保护联系方式计算七个互不重复的计数器位置。
    hash-count: ${IDENTITY_PRESENCE_BLOOM_HASH_COUNT:7}
    # 每个计数器占一个字节并允许表达零到二百五十五。
    counter-bytes: ${IDENTITY_PRESENCE_BLOOM_COUNTER_BYTES:1}
    # 每个 Redis String Bucket 保存一百万个计数器，当前约占一 MiB。
    counters-per-bucket: ${IDENTITY_PRESENCE_BLOOM_COUNTERS_PER_BUCKET:1000000}
    # PostgreSQL 初始化使用五百条游标分页，避免一次加载全表。
    build-batch-size: ${IDENTITY_PRESENCE_BLOOM_BUILD_BATCH_SIZE:500}
    # 用户 ID 幂等凭据拆成二百五十六个 Set，控制单 Key 成员数量。
    receipt-shards: ${IDENTITY_PRESENCE_BLOOM_RECEIPT_SHARDS:256}
    # 单个过滤器最多按十万条规划，达到边界后必须扩容并重建。
    maximum-elements: ${IDENTITY_PRESENCE_BLOOM_MAXIMUM_ELEMENTS:100000}

  # 注册会话、验证与外部投递的服务层配置。
  registration:
    # Redis Key 环境段用于隔离不同部署环境并统一转为小写。
    environment: ${APP_ENV:PROD}
    # 注册敏感标识使用的 HMAC 密钥必须由部署环境提供。
    hmac-secret-base64: ${AUTH_HMAC_SECRET_BASE64}
    # 注册主流程使用十分钟空闲期限，仅白名单拦截器请求可续签且受三十分钟绝对期限约束。
    flow-ttl: ${REGISTRATION_FLOW_TTL:600s}
    # 冲突计数采用固定五分钟窗口，后续冲突不会重置窗口 TTL。
    conflict-window: ${REGISTRATION_CONFLICT_WINDOW:5m}
    # 同一安装设备前五次冲突只累计，第六次冲突封禁注册域两小时。
    conflict-block-duration: ${REGISTRATION_CONFLICT_BLOCK_DURATION:2h}
    # 验证码最长存活五分钟且不得超过注册流程剩余时间。
    code-ttl: ${REGISTRATION_CODE_TTL:5m}
    # 同一渠道两次发送之间至少冷却六十秒。
    send-cooldown: ${REGISTRATION_SEND_COOLDOWN:60s}
    # 每种验证渠道在固定窗口内允许前五次发送，第六次触发注册域封禁。
    max-sends-per-channel: ${REGISTRATION_MAX_SENDS_PER_CHANNEL:5}
    # 每个验证码最多允许五次错误尝试后立即作废。
    max-code-attempts: ${REGISTRATION_MAX_CODE_ATTEMPTS:5}
    # 注册 Turnstile 服务端校验配置。
    turnstile:
      # Turnstile Secret 必须由部署环境提供且禁止生产默认值。
      secret-key: ${TURNSTILE_SECRET_KEY}
      # Turnstile hostname 只能命中部署环境提供的显式白名单。
      allowed-hosts: ${TURNSTILE_ALLOWED_HOSTS}
    # 注册邮件投递配置。
    mail:
      # 发件地址必须由部署环境配置为已验证的邮件身份。
      from: ${REGISTRATION_MAIL_FROM}
    # Gmail API 邮箱验证码投递配置，仅在完整 OAuth 凭据存在时启用。
    gmail:
      # Gmail API 发件地址必须与 OAuth 授权邮箱一致或具备对应发送权限。
      from: ${GMAIL_FROM_ADDRESS:}
      # Gmail API OAuth refresh token 换取 access token 的配置。
      oauth:
        # Gmail OAuth Client ID 必须由部署环境提供，禁止写入仓库。
        client-id: ${GMAIL_OAUTH_CLIENT_ID:}
        # Gmail OAuth Client Secret 必须由部署环境提供，禁止写入仓库。
        client-secret: ${GMAIL_OAUTH_CLIENT_SECRET:}
        # Gmail OAuth Refresh Token 必须由部署环境提供，禁止写入仓库。
        refresh-token: ${GMAIL_OAUTH_REFRESH_TOKEN:}
        # Gmail OAuth Token 端点保持官方默认值，允许测试环境替换为本地桩服务。
        token-uri: ${GMAIL_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
      # Gmail messages.send 端点保持官方默认值，允许测试环境替换为本地桩服务。
      send-uri: ${GMAIL_SEND_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages/send}
      # Gmail API 单次 HTTP 请求超时，防止消费者线程长时间占用未 ACK 消息。
      request-timeout: ${GMAIL_REQUEST_TIMEOUT:5s}
    # Microsoft Graph 邮箱验证码投递配置，仅在个人账户的完整 OAuth 凭据存在时启用。
    microsoft-graph:
      # Microsoft OAuth refresh token 换取短期 access token 的配置。
      oauth:
        # Entra 应用程序客户端 ID 由部署环境提供，禁止写入仓库。
        client-id: ${MICROSOFT_GRAPH_CLIENT_ID:}
        # Entra 客户端密钥值属于 Secret，必须由部署环境提供。
        client-secret: ${MICROSOFT_GRAPH_CLIENT_SECRET:}
        # Microsoft OAuth Refresh Token 必须由部署环境提供且禁止记录到日志。
        refresh-token: ${MICROSOFT_GRAPH_REFRESH_TOKEN:}
        # 个人 Microsoft 账户使用 consumers OAuth 端点，测试环境可以覆盖为本地桩服务。
        token-uri: ${MICROSOFT_GRAPH_TOKEN_URI:https://login.microsoftonline.com/consumers/oauth2/v2.0/token}
        # 令牌刷新只申请离线访问和邮件发送的最小委托权限。
        scope: ${MICROSOFT_GRAPH_SCOPE:offline_access https://graph.microsoft.com/Mail.Send}
      # Graph 邮件发送固定调用当前访问令牌主体的 me/sendMail，测试环境可覆盖为本地桩服务。
      send-uri: ${MICROSOFT_GRAPH_SEND_URI:https://graph.microsoft.com/v1.0/me/sendMail}
      # OAuth 交换独立使用十秒预算，并兼容一版旧的统一超时环境变量。
      oauth-timeout: ${MICROSOFT_GRAPH_OAUTH_TIMEOUT:${MICROSOFT_GRAPH_REQUEST_TIMEOUT:10s}}
      # sendMail 调用独立使用十秒预算，并兼容一版旧的统一超时环境变量。
      send-timeout: ${MICROSOFT_GRAPH_SEND_TIMEOUT:${MICROSOFT_GRAPH_REQUEST_TIMEOUT:10s}}
    # 验证码异步投递消息的安全、超时和 RabbitMQ 控制配置。
    delivery:
      # RabbitMQ 消息中的验证码和目标地址使用 AES-GCM 加密，密钥必须是规范 Base64 的 32 字节随机值。
      payload-key-base64: ${VERIFICATION_DELIVERY_PAYLOAD_KEY_BASE64}
      # 消费者提供二十五秒总保护时间，为 OAuth 和 sendMail 两阶段完成后保留结果映射余量。
      provider-timeout: ${VERIFICATION_DELIVERY_PROVIDER_TIMEOUT:25s}
      # 验证码 RabbitMQ 发布确认与消费者数量配置。
      rabbit:
        # 默认启用 RabbitMQ 异步投递；测试或本地最小上下文可以显式关闭并提供替代 Publisher。
        enabled: ${VERIFICATION_DELIVERY_RABBIT_ENABLED:true}
        # 发布方等待 Broker confirm 的最长时间，超时视为发布失败并触发上游补偿或重新投递。
        confirm-timeout: ${VERIFICATION_DELIVERY_RABBIT_CONFIRM_TIMEOUT:5s}
        # 邮箱验证码默认只启用一个消费者，配合 prefetch=1 控制 Gmail 和 Graph 调用并发。
        email-consumers: ${VERIFICATION_DELIVERY_EMAIL_CONSUMERS:1}
        # 短信验证码默认只启用一个消费者，配合 prefetch=1 控制短信供应商调用并发。
        sms-consumers: ${VERIFICATION_DELIVERY_SMS_CONSUMERS:1}
    # 注册流程只在此选择阿里云审核模板，客户端、凭据和代理路径由统一工具配置管理。
    sms:
      # 短信模板必须同时声明 code 与 min 变量，并由部署环境选择审核通过的模板。
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    # Twilio WhatsApp Content Template 验证码投递配置。
    whatsapp:
      # WhatsApp Sender 使用 E.164 号码；Sandbox 默认号码可由正式 Sender 覆盖。
      from: ${TWILIO_WHATSAPP_FROM:+14155238886}
      # 验证码 Content SID 必须由部署环境提供，模板变量 1 固定承载六位验证码。
      content-sid: ${TWILIO_WHATSAPP_CONTENT_SID:}
      # Twilio 状态回调必须使用公开 HTTPS 地址；为空时仅记录创建结果，不注册回调。
      status-callback-url: ${TWILIO_WHATSAPP_STATUS_CALLBACK_URL:}
      # Twilio HTTP 连接建立超时时间，超时后将结果归类为 UNKNOWN。
      connect-timeout: ${TWILIO_WHATSAPP_CONNECT_TIMEOUT:5s}
      # Twilio HTTP 响应头超时时间，避免请求无限等待并持有 Rabbit 消息。
      response-timeout: ${TWILIO_WHATSAPP_RESPONSE_TIMEOUT:20s}
      # Twilio HTTP 响应体读取超时时间，读取中断时不得自动重复 POST。
      read-timeout: ${TWILIO_WHATSAPP_READ_TIMEOUT:20s}

# 阿里云公共工具配置只声明短信凭据与显式代理，OSS 继续使用 SDK 标准环境变量和默认网络路径。
aliyun:
  # 阿里云号码认证短信客户端配置。
  sms:
    # AccessKey ID 优先使用项目变量并兼容阿里云 SDK 标准变量，配置文件不提供密钥默认值。
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:${ALIBABA_CLOUD_ACCESS_KEY_ID:}}
    # AccessKey Secret 优先使用项目变量并兼容阿里云 SDK 标准变量，配置文件不提供密钥默认值。
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}}
    # 短信签名必须与阿里云审核通过的签名完全一致，并支持环境变量覆盖。
    sign-name: ${ALIYUN_SMS_SIGN_NAME:速通互联验证平台}
    # 短信 HTTP CONNECT 代理与自动选路配置，不影响 OSS 的网络路径。
    proxy:
      # 默认启用短信显式代理候选探测，避免依赖 JVM 是否读取系统代理。
      enabled: ${ALIYUN_SMS_PROXY_ENABLED:true}
      # 本地 Mihomo Mixed/HTTP 代理默认只监听回环地址。
      host: ${ALIYUN_SMS_PROXY_HOST:127.0.0.1}
      # 首选 HTTP CONNECT 代理端口与当前 Mihomo 配置保持一致。
      port: ${ALIYUN_SMS_PROXY_PORT:7897}
      # auto 会比较直连与有限代理候选，direct 和 proxy 可用于受控故障排查。
      route-mode: ${ALIYUN_SMS_PROXY_ROUTE_MODE:auto}
      # 单条候选路径探测最多等待一千五百毫秒，避免阻塞验证码消费者过久。
      route-probe-timeout-ms: ${ALIYUN_SMS_PROXY_ROUTE_PROBE_TIMEOUT_MS:1500}

# 本地代理候选用于第三方工具的有限路径探测，不修改 Windows、DNS 或 Mihomo 全局配置。
local-proxy:
  # 默认允许工具检查本机代理候选端口。
  enabled: ${LOCAL_PROXY_ENABLED:true}
  # 代理候选默认只使用回环地址，禁止意外连接局域网代理。
  host: ${LOCAL_PROXY_HOST:127.0.0.1}
  # 候选顺序优先当前 7897 端口，并保留 7892 作为兼容回退。
  ports: ${LOCAL_PROXY_PORTS:7897,7892}

# Web 服务监听配置。
server:
  # Web 服务端口支持环境变量覆盖，具体传输协议由激活的 Profile 决定。
  port: ${SERVER_PORT:6655}

# Springdoc OpenAPI 配置。
springdoc:
  # Swagger UI 展示配置。
  swagger-ui:
    # Swagger UI 使用固定入口便于网关放行。
    path: /swagger-ui.html

# Knife4j API 文档配置。
knife4j:
  # 默认关闭 Knife4j 增强自动配置，避免 4.5.0 与 Springdoc 2.8.x 的 OpenAPI 定制器签名冲突。
  enable: ${KNIFE4J_ENABLE:false}

# 验证码投递日志默认关闭 DEBUG 细节，生产排障时必须通过环境变量显式开启。
logging:
  # 包级日志级别只控制验证码投递链路，不改变全局日志噪声和现有告警级别。
  level:
    # 默认 INFO 不输出新增 DEBUG 事件，临时设置环境变量为 DEBUG 后需重启实例生效。
    com.example.temperate.service.registration.verification: ${VERIFICATION_DELIVERY_LOG_LEVEL:INFO}
    # 网络风险 Web 边界默认只记录拒绝告警，临时 DEBUG 用于观察 REQUEST 与 ASYNC 分派链路。
    com.example.temperate.web.risk: ${NETWORK_RISK_DIAGNOSTIC_LOG_LEVEL:INFO}
    # 网络风险 Service 默认只记录状态转换失败，临时 DEBUG 用于关联 PreAuth 与风险评估轨迹。
    com.example.temperate.service.risk.logging: ${NETWORK_RISK_DIAGNOSTIC_LOG_LEVEL:INFO}

# 普通用户头像对象存储只保存 Bucket 位置和非敏感行为参数，OSS 凭据由 SDK 标准环境变量读取。
user-avatar:
  # 头像对象存储连接、公开访问地址和预签名有效期配置。
  oss:
    # 头像 Bucket 名称允许按部署环境覆盖，Bucket 必须保持公共读且禁止公共写。
    bucket: ${ALIYUN_OSS_AVATAR_BUCKET:ihaveaplan}
    # OSS Region 必须与 Bucket 实际地域一致，避免签名地域不匹配。
    region: ${ALIYUN_OSS_AVATAR_REGION:us-west-1}
    # OSS SDK 服务端点用于签名、HEAD、下载、复制和精确删除。
    endpoint: ${ALIYUN_OSS_AVATAR_ENDPOINT:https://oss-us-west-1.aliyuncs.com}
    # 正式头像公开 URL 基地址可以在以后切换为 CDN 域名而不改数据库业务代码。
    public-base-url: ${ALIYUN_OSS_AVATAR_PUBLIC_BASE_URL:https://ihaveaplan.oss-us-west-1.aliyuncs.com}
    # 预签名 PUT 默认十分钟失效，客户端超时后必须重新创建预上传。
    presigned-url-ttl: ${ALIYUN_OSS_AVATAR_PRESIGNED_URL_TTL:PT10M}

# AI 模型图标对象存储独立配置，业务路径与普通用户头像互不复用。
ai-model-icon:
  # 远程 SVG 可信官方兼容档位只由最终响应域名触发，不影响普通外链和本地上传。
  remote-svg:
    # 开关关闭时八家厂商也全部回退为原有严格 SVG 白名单。
    trusted-official-profile-enabled: ${AI_MODEL_ICON_TRUSTED_OFFICIAL_SVG_ENABLED:true}
    # 各厂商可信主机只覆盖自身和真实子域名，共享 CDN 必须配置到精确主机。
    trusted-hosts:
      # OpenAI 与 ChatGPT 官方站点可以使用受限样式和内嵌栅格图片。
      openai: ${AI_MODEL_ICON_TRUSTED_OPENAI_HOSTS:chatgpt.com,openai.com}
      # Anthropic 与 Claude 官方站点可以使用受限样式和内嵌栅格图片。
      anthropic: ${AI_MODEL_ICON_TRUSTED_ANTHROPIC_HOSTS:claude.ai,anthropic.com}
      # Gemini 官方站点及其精确静态资源主机可以使用兼容档位。
      google: ${AI_MODEL_ICON_TRUSTED_GOOGLE_HOSTS:gemini.google.com,www.gstatic.com}
      # xAI 与 Grok 官方站点可以使用受限样式和内嵌栅格图片。
      xai: ${AI_MODEL_ICON_TRUSTED_XAI_HOSTS:grok.com,x.ai}
      # DeepSeek 官方站点可以使用受限样式和内嵌栅格图片。
      deepseek: ${AI_MODEL_ICON_TRUSTED_DEEPSEEK_HOSTS:deepseek.com}
      # 智谱、ChatGLM 与 BigModel 官方站点可以使用兼容档位。
      zhipu: ${AI_MODEL_ICON_TRUSTED_ZHIPU_HOSTS:zhipuai.cn,chatglm.cn,bigmodel.cn}
      # Kimi 与 Moonshot 官方站点可以使用受限样式和内嵌栅格图片。
      moonshot: ${AI_MODEL_ICON_TRUSTED_MOONSHOT_HOSTS:kimi.com,moonshot.cn,moonshot.ai}
      # 通义千问只信任 qwen.ai 点边界子域，不扩大到阿里共享 CDN。
      qwen: ${AI_MODEL_ICON_TRUSTED_QWEN_HOSTS:qwen.ai}
  # 模型图标 OSS Bucket、公开地址和固定对象前缀配置。
  oss:
    # Bucket 必须配置为公共读、禁止公共写，应用凭据由 OSS SDK 标准环境变量读取。
    bucket: ${ALIYUN_OSS_MODEL_ICON_BUCKET:ihaveaplan}
    # Region 必须与模型图标 Bucket 实际地域一致。
    region: ${ALIYUN_OSS_MODEL_ICON_REGION:us-west-1}
    # Endpoint 用于模型图标上传、覆盖和精确删除。
    endpoint: ${ALIYUN_OSS_MODEL_ICON_ENDPOINT:https://oss-us-west-1.aliyuncs.com}
    # 公开 URL 基地址可以切换为 CDN 域名而不改变数据库结构。
    public-base-url: ${ALIYUN_OSS_MODEL_ICON_PUBLIC_BASE_URL:https://ihaveaplan.oss-us-west-1.aliyuncs.com}
    # 固定前缀把模型图标限制在独立目录，末尾斜杠由路径工厂统一规范化。
    prefix: ${ALIYUN_OSS_MODEL_ICON_PREFIX:ai-temperate/models/icons/}
