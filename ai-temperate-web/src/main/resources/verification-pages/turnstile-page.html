<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src data: https://challenges.cloudflare.com; base-uri 'none'; form-action 'none'">
  <title>安全验证</title>
  <link rel="stylesheet" href="./page.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">完成安全验证</h1>
      <p class="hint">验证完成后将自动返回应用。</p>
      <p id="status" class="status" role="status" aria-live="polite">正在加载安全验证…</p>
      <div id="widget"></div>
      <p id="error" class="error" role="alert" aria-live="assertive"></p>
      <div class="actions">
        <button id="cancel" type="button">取消</button>
        <button id="retry" type="button" hidden>重新验证</button>
      </div>
    </section>
  </main>
  <script src="./page.js"></script>
</body>
</html>
