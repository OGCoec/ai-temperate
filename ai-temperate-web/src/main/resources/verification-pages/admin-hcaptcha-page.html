<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://hcaptcha.com https://*.hcaptcha.com; frame-src https://hcaptcha.com https://*.hcaptcha.com; connect-src https://hcaptcha.com https://*.hcaptcha.com; style-src 'self'; img-src data: https://hcaptcha.com https://*.hcaptcha.com; base-uri 'none'; form-action 'none'">
  <title>管理员安全验证</title>
  <link rel="stylesheet" href="./page.css">
</head>
<body>
  <main>
    <section aria-labelledby="page-title">
      <h1 id="page-title">管理员安全验证</h1>
      <p id="status" role="status" aria-live="polite">正在加载安全验证…</p>
      <div id="widget"></div>
      <div id="error" role="alert" aria-live="assertive"></div>
      <div class="actions">
        <button id="cancel" type="button">取消</button>
        <button id="retry" type="button" hidden>重新验证</button>
      </div>
    </section>
  </main>
  <script src="./page.js"></script>
</body>
</html>
