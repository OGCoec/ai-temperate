# Spring Boot 测试环境配置。
spring:
  # 测试环境自动配置控制。
  autoconfigure:
    # 测试时关闭需要真实外部基础设施的自动配置。
    exclude:
      # 测试时不初始化 PostgreSQL 数据源。
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      # 测试时不初始化 Redis 连接工厂。
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      # 测试时不初始化 RabbitMQ 连接工厂。
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  # 测试邮件配置只使用明确的非生产假值。
  mail:
    # 测试 SMTP 密码不对应任何真实服务。
    password: test-mail-password
  # 测试数据库配置只用于覆盖生产环境占位符。
  datasource:
    # 测试数据库密码是假值且数据源自动配置已关闭。
    password: test-postgres-password
  # 测试 Spring Data 配置只用于覆盖生产环境占位符。
  data:
    # 测试 Redis 配置不会创建真实连接。
    redis:
      # 测试 Redis 密码是不对应任何实例的假值。
      password: test-redis-password
  # 测试 RabbitMQ 配置只用于覆盖生产环境占位符。
  rabbitmq:
    # 测试 RabbitMQ 密码是不对应任何 Broker 的假值。
    password: test-rabbitmq-password

  # 测试不注册真实 Spring AI ChatModel，避免上下文测试连接本机 CLIProxyAPI。
  ai:
    # 测试模型选择显式关闭全部 OpenAI 自动配置，避免任何测试连接本机 CLIProxyAPI。
    model:
      # none 只用于阻止测试上下文创建外部模型客户端。
      chat: none
      # 测试不创建 OpenAI Embedding 模型。
      embedding: none
      # 测试不创建 OpenAI Image 模型。
      image: none
      # 测试音频模型选择分别关闭语音合成与转录自动配置。
      audio:
        # 测试不创建 OpenAI Speech 模型。
        speech: none
        # 测试不创建 OpenAI Transcription 模型。
        transcription: none
      # 测试不创建 OpenAI Moderation 模型。
      moderation: none
    # 测试重试配置保持单次调用语义，即使将来单独启用模型也不会自动重复请求。
    retry:
      # 一次尝试包含首次请求本身，因此不会执行额外重试。
      max-attempts: 1
    # 测试仍提供普通 OpenAI Starter 的非生产假值以覆盖主配置中的密钥占位符。
    openai:
      # 该值不对应任何真实 CLIProxyAPI 密钥。
      api-key: test-cli-proxy-api-key

# 测试模型图标配置只参与属性绑定和本地 Mock，不连接任何外部官方站点。
ai-model-icon:
  # 测试显式启用可信官方 SVG 档位以覆盖 Registry 启动与选择行为。
  remote-svg:
    # 测试环境允许由固定假请求上下文选择兼容档位。
    trusted-official-profile-enabled: true
    # 测试沿用生产默认厂商主机，但不会发起真实网络请求。
    trusted-hosts:
      # OpenAI 测试主机配置。
      openai: chatgpt.com,openai.com
      # Anthropic 测试主机配置。
      anthropic: claude.ai,anthropic.com
      # Google 测试主机配置保持共享 CDN 精确到 www 主机。
      google: gemini.google.com,www.gstatic.com
      # xAI 测试主机配置。
      xai: grok.com,x.ai
      # DeepSeek 测试主机配置。
      deepseek: deepseek.com
      # 智谱测试主机配置。
      zhipu: zhipuai.cn,chatglm.cn,bigmodel.cn
      # Moonshot 与 Kimi 测试主机配置。
      moonshot: kimi.com,moonshot.cn,moonshot.ai
      # 通义千问测试主机只用于属性绑定，不发起真实网络请求。
      qwen: qwen.ai

# 测试应用业务、Web 异步响应与安全配置。
app:
  # 测试 MVC 异步响应只验证有界执行器和超时关系，不建立任何外部连接。
  web:
    # 测试使用与生产默认值相同的异步响应边界。
    mvc-async:
      # 测试核心线程数固定为十六。
      core-pool-size: 16
      # 测试最大线程数固定为一百六十。
      max-pool-size: 160
      # 测试同样禁止长连接任务进入等待队列。
      queue-capacity: 0
      # 测试空闲线程保留六十秒。
      keep-alive: 60s
      # 测试 MVC 外层时限比模型总期限多一分钟。
      timeout: 16m

  # 上下文测试关闭后台身份 Bloom 构建，避免连接任何真实 Redis 或 PostgreSQL。
  identity-presence-bloom:
    # 测试环境仅验证 Bean 与配置绑定，不启动后台全量初始化。
    enabled: false

  # 测试用户资料缓存只验证属性绑定和 Bean 装配，不连接真实 Redis。
  user-profile-cache:
    # 固定测试 AES-256-KWP 密钥恰好解码为三十二字节，不对应生产缓存。
    id-encryption-key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    # 测试资料缓存随机 TTL 下界保持五分钟。
    minimum-ttl: 5m
    # 测试资料缓存随机 TTL 上界保持十五分钟。
    maximum-ttl: 15m

  # 测试 AI 模型缓存使用固定非生产密钥和生产允许范围内的 TTL，不连接真实 Redis。
  ai-model-cache:
    # 固定测试密钥恰好解码为三十二字节，不对应任何生产缓存。
    encryption-key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    # 测试随机 TTL 下界保持五分钟。
    minimum-ttl: 5m
    # 测试随机 TTL 上界保持十五分钟。
    maximum-ttl: 15m
    # 测试聚合快照最多允许五百个模型。
    max-models: 500

  # 测试 AI 会话配置只参与属性绑定和 Bean 装配，不连接真实 Redis 或模型服务。
  ai-conversation:
    # 测试保持固定七十二小时绝对缓存期限。
    context-ttl: 72h
    # 测试生成租约使用四十五秒。
    inflight-lease-ttl: 45s
    # 测试压缩租约使用五分钟。
    compaction-lease-ttl: 5m
    # 测试流片最多累计二百五十毫秒。
    stream-flush-interval: 250ms
    # 测试 Redis 文本字段按四 KiB 切分。
    stream-flush-bytes: 4096
    # 测试数据库批量读取保持五百条。
    context-page-size: 500
    # 测试单会话 Hash 字段上限保持五千。
    max-hash-fields: 5000
    # 测试在一千字段时触发临时上下文压缩。
    compaction-hash-field-threshold: 1000
    # 测试单用户并发上限为四。
    max-concurrent-per-user: 4
    # 测试全部应用实例共享的并发上限为一百二十八。
    max-concurrent-global: 128
    # 测试图片采用固定保守 Token 估算。
    image-estimated-tokens: 2048
    # 测试压缩阈值保持百分之八十。
    pre-compaction-percent: 80
    # 测试 RESERVED 超时判定保留两分钟安全缓冲。
    reservation-safety-buffer: 2m
    # 测试每分钟扫描一次过期 RESERVED。
    reconciliation-scan-interval: 1m
    # 测试单批最多处理五百条待对账记录。
    reconciliation-batch-size: 500
    # 测试环境默认关闭历史系统失败自动补退，防止上下文启动时修改外部状态。
    historical-system-failure-auto-refund-enabled: false
    # 测试系统提示不包含任何生产业务数据。
    system-prompt: 你是测试环境中的可靠 AI 助手。
    # 测试会话附件使用完全虚构的 OSS 边界，不执行任何外部请求。
    attachments:
      # 测试 Bucket 名称不对应生产对象存储。
      bucket: conversation-attachments-test
      # 测试区域只参与配置绑定。
      region: us-west-1
      # 测试 Endpoint 使用保留域名且不会被连接。
      endpoint: https://oss.example.test
      # 测试公开地址使用保留域名。
      public-base-url: https://public-oss.example.test
      # 测试 PUT 预签名有效十分钟。
      presigned-put-ttl: 10m
      # 测试模型读取签名有效十分钟。
      signed-get-ttl: 10m
      # 测试单文件限制保持一百 MiB。
      max-file-bytes: 104857600
      # 测试每条用户输入或模型输出最多保留八个附件。
      max-files-per-message: 8
      # 测试每条用户输入或模型输出的附件总计最多二百 MiB。
      max-total-bytes-per-message: 209715200
      # 测试正式对象落盘最多尝试三次。
      finalization-attempts: 3
      # 测试客户端并发上传上限为三个。
      client-upload-concurrency: 3
      # 测试音频每 MiB 使用四千零九十六 Token 估算。
      audio-tokens-per-mib: 4096
      # 测试音频固定安全开销为二百五十六 Token。
      audio-fixed-tokens: 256
      # 测试视频每 MiB 使用八千一百九十二 Token 估算。
      video-tokens-per-mib: 8192
      # 测试视频固定安全开销为二百五十六 Token。
      video-fixed-tokens: 256
      # 测试模型媒体连接最多等待两秒。
      media-connect-timeout: 2s
      # 测试模型媒体读取最多等待十秒。
      media-read-timeout: 10s
      # 测试模型媒体最多跟随两次重定向。
      media-max-redirects: 2
    # 测试幂等摘要使用独立非生产密钥。
    security:
      # 固定测试 HMAC 密钥不对应任何生产部署。
      idempotency-hmac-key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  # 测试 CLIProxyAPI 推理显式关闭，不进行任何外部网络调用。
  ai-inference:
    # 测试推理客户端只验证配置边界。
    cli-proxy:
      # 测试上下文不启用用户模型推理。
      enabled: false
      # 测试使用不可路由的虚构 CLIProxyAPI 地址。
      base-url: https://cli-proxy.example.test/v1
      # 推理关闭时无需提供真实普通代理密钥。
      api-key: ""
      # 测试最大流时长从订阅开始固定为十五分钟。
      max-stream-duration: 15m

  # 测试网络风险使用禁用模式和固定非生产密钥，不连接真实供应商。
  network-risk:
    # 上下文测试默认不执行网络风险拦截。
    mode: DISABLED
    # 固定测试 HMAC 密钥仅用于属性绑定和单元测试。
    hmac-secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    # 固定测试加密主密钥不对应任何生产凭据。
    ip2-location-api-key-encryption-key-base64: YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=
    # 测试 IP2Location 地址不会在第一阶段或上下文测试中主动调用。
    ip2-location-base-url: https://ip2location.test/
    # 测试 iPing 地址不会在第一阶段或上下文测试中主动调用。
    iping-base-url: https://iping.test/v1/query
    # 测试保留 iPing 策略 Bean 以验证 Registry 完整性。
    iping-enabled: true
    # 测试外部查询总预算保持八秒上限。
    lookup-timeout: 8s
    # 测试完整结果缓存期限使用一小时固定值。
    positive-cache-ttl: 1h
    # 测试降级结果缓存期限使用一分钟固定值。
    fallback-cache-ttl: 1m
    # 测试 single-flight 锁覆盖一次外部查询。
    single-flight-ttl: 9s
    # 测试外部查询最大并发保持四个。
    max-concurrent-lookups: 4
    # 测试匿名 PreAuth 使用三十分钟期限。
    anonymous-pre-auth-ttl: 30m
    # 测试登录 PreAuth 使用六小时期限。
    authenticated-pre-auth-ttl: 6h
    # 测试 Challenge 引用使用五分钟期限。
    challenge-ttl: 5m
    # 测试 Challenge 通过状态使用三十分钟期限。
    challenge-verified-ttl: 30m
    # 测试不可能旅行使用两百公里最小距离。
    impossible-travel-minimum-distance-km: 200
    # 测试不可能旅行比较窗口使用二十四小时。
    impossible-travel-window: 24h
    # 测试临时 Block 使用十分钟期限。
    temporary-block-ttl: 10m
    # 测试 WebRTC 配置只参与属性绑定，不连接任何公共 STUN 服务。
    web-rtc:
      # 测试客户端探测上限固定为十五秒。
      probe-timeout: 15s
      # 测试保持生产环境相同的四个 STUN 地址和顺序。
      stun-urls:
        # Google STUN 测试配置只作为响应数据。
        - stun:stun.l.google.com:19302
        # Cloudflare STUN 测试配置只作为响应数据。
        - stun:stun.cloudflare.com:3478
        # Twilio STUN 测试配置只作为响应数据。
        - stun:global.stun.twilio.com:3478
        # Nextcloud STUN 测试配置只作为响应数据。
        - stun:stun.nextcloud.com:3478
      # 测试单次报告最多接受八个公网地址。
      max-reported-ips: 8
      # 固定测试密钥仅用于属性绑定和单元测试，不对应生产凭据。
      ip-encryption-key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  # 测试属性仍执行与生产相同的绑定和边界校验。
  security:
    # 明确标记为 TEST，允许测试使用本机 HTTP Origin。
    env: TEST
    # 测试 JWT 签名配置。
    jwt:
      # 该规范 Base64 值仅由固定测试字节构造，不是生产密钥。
      secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    # 测试 HMAC 配置。
    hmac:
      # 该规范 Base64 值仅由另一组固定测试字节构造。
      secret-base64: YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=
    # 测试 Turnstile 配置。
    turnstile:
      # 使用 Cloudflare 文档测试格式的非生产 Site Key。
      site-key: 1x00000000000000000000AA
      # 使用 Cloudflare 文档测试格式的非生产 Secret Key。
      secret-key: 1x0000000000000000000000000000000AA
      # 测试只接受本机 hostname。
      allowed-hosts: localhost
    # 测试环境使用与生产相同的认证与流程 Cookie 隔离策略。
    cookies:
      # 测试 Access Token Cookie 的安全属性和路径。
      access:
        # 测试 Access Token Cookie 保持 Secure。
        secure: true
        # 测试 Access Token Cookie 保持 HttpOnly。
        http-only: true
        # 测试 Access Token Cookie 使用严格同站策略。
        same-site: STRICT
        # 测试 Access Token Cookie 仅作用于 API。
        path: /api
      # 测试 Refresh Token Cookie 的安全属性和路径。
      refresh:
        # 测试 Refresh Token Cookie 保持 Secure。
        secure: true
        # 测试 Refresh Token Cookie 保持 HttpOnly。
        http-only: true
        # 测试 Refresh Token Cookie 使用严格同站策略。
        same-site: STRICT
        # 测试 Refresh Token Cookie 仅作用于会话端点。
        path: /api/auth/session
      # 测试 CSRF Cookie 的可读属性和路径。
      csrf:
        # 测试 CSRF Cookie 保持 Secure。
        secure: true
        # 测试 CSRF Cookie 允许前端读取。
        http-only: false
        # 测试 CSRF Cookie 使用严格同站策略。
        same-site: STRICT
        # 测试 CSRF Cookie 作用于整个站点。
        path: /
      # 测试注册流程 Token Cookie 的安全属性和路径。
      register-flow:
        # 测试注册流程 Token Cookie 保持 Secure。
        secure: true
        # 测试注册流程 Token Cookie 保持 HttpOnly。
        http-only: true
        # 测试注册流程 Token Cookie 使用严格同站策略。
        same-site: STRICT
        # 测试注册流程 Token Cookie 只作用于注册端点。
        path: /api/auth/register
      # 测试注册 Challenge Cookie 的安全属性和路径。
      register-challenge:
        # 测试注册 Challenge Cookie 保持 Secure。
        secure: true
        # 测试注册 Challenge Cookie 保持 HttpOnly。
        http-only: true
        # 测试注册 Challenge Cookie 使用严格同站策略。
        same-site: STRICT
        # 测试注册 Challenge Cookie 只作用于注册端点。
        path: /api/auth/register
      # 测试找回密码流程 Token Cookie 的安全属性和路径。
      password-reset-flow:
        # 测试找回密码流程 Token Cookie 保持 Secure。
        secure: true
        # 测试找回密码流程 Token Cookie 保持 HttpOnly。
        http-only: true
        # 测试找回密码流程 Token Cookie 使用严格同站策略。
        same-site: STRICT
        # 测试找回密码流程 Token Cookie 只作用于找回密码端点。
        path: /api/auth/password-reset
      # 测试找回密码一次性凭证 Cookie 的安全属性和路径。
      password-reset-forget:
        # 测试找回密码一次性凭证 Cookie 保持 Secure。
        secure: true
        # 测试找回密码一次性凭证 Cookie 保持 HttpOnly。
        http-only: true
        # 测试找回密码一次性凭证 Cookie 使用严格同站策略。
        same-site: STRICT
        # 测试找回密码一次性凭证 Cookie 只作用于完成端点。
        path: /api/auth/password-reset/complete
    # 测试 CORS 白名单配置。
    cors:
      # TEST 环境允许本机开发服务器的显式 Origin。
      allowed-origins: http://localhost:5173
    # 测试 TTL 使用生产允许范围内的固定值。
    ttl:
      # 测试 Access Token 签发与 Cookie Max-Age 共用十分钟 TTL。
      access-token: 10m
      # 测试验证码 TTL 为 5 分钟。
      verification-code: 5m
      # 测试正向缓存 TTL 为 10 分钟。
      positive-cache: 10m
      # 测试空值缓存 TTL 为 45 秒。
      empty-cache: 45s

  # 测试单管理员配置使用隔离路径、假密钥和本机 hCaptcha 域名。
  admin:
    # 测试隐藏配置路径不对应生产管理员文件。
    config-path: target/admin-test/complete.yaml
    # 固定测试 HMAC 密钥不可用于生产会话。
    session-hmac-secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    # 测试管理员会话保持六小时滑动期限。
    session-ttl: 6h
    # 测试最多允许十个管理员设备会话。
    max-sessions: 10
    # 测试管理员注册 Flow 固定十分钟。
    registration-flow-ttl: 10m
    # 测试管理员登录 Flow 固定十分钟。
    login-flow-ttl: 10m
    # 测试管理员邮箱检查只验证属性绑定，不创建 Rabbit 连接或执行外部邮箱调用。
    mail-inspection:
      # 测试 Redis JobStore 使用非生产固定边界且不连接生产 Redis。
      job:
        # 测试同时最多保留两个活动任务类型。
        max-active-jobs: 2
        # 测试同一检查类型只允许一个活动任务。
        max-active-jobs-per-type: 1
        # 测试任务默认使用四个业务并发额度。
        default-business-concurrency: 4
        # 测试任务业务并发上限保持六十四。
        max-business-concurrency: 64
        # 测试单行字符边界保持十二 KiB。
        max-line-chars: 12288
        # 测试请求 UTF-8 总量边界保持一 MiB。
        max-request-bytes: 1048576
        # 测试活动租约固定十五分钟。
        active-lease: 15m
        # 测试终态保留固定十五分钟。
        terminal-retention: 15m
        # 测试租约心跳固定三十秒。
        lease-heartbeat-interval: 30s
        # 测试单任务最多一万行。
        max-credential-lines: 10000
        # 测试结果桶固定三十二条。
        result-bucket-size: 32
        # 测试 SSE 快照批次固定一百条。
        snapshot-batch-size: 100
        # 固定测试 HMAC 密钥恰好解码为三十二字节，不对应生产环境。
        key-hmac-secret-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # 测试 SSE 属性只验证绑定，不建立真实浏览器连接。
      sse:
        # 测试心跳间隔固定十五秒。
        heartbeat-interval: 15s
        # 测试空闲重连阈值固定四十五秒。
        idle-reconnect-threshold: 45s
        # 测试连接超时固定三十分钟。
        connection-timeout: 30m
        # 测试每个管理员会话最多四条连接。
        max-connections-per-admin: 4
      # 测试环境关闭真实 Rabbit 工作调度并使用 Fail Closed 替身。
      rabbit:
        # 普通上下文测试不注册 Rabbit 拓扑、消费者或启动恢复扫描器。
        enabled: false
        # 固定测试 AES-256-GCM 密钥恰好解码为三十二字节，不对应生产消息。
        payload-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # 测试提交层使用小边界验证属性绑定，不会连接 RabbitMQ。
      submission:
        # 测试残缺提交保留期与生产默认值一致。
        incomplete-retention: 6h
        # 测试残缺任务清理间隔固定为一分钟。
        cleanup-interval: 1m
        # 测试分块明文上限保持一百六十 KiB。
        max-plaintext-chunk-bytes: 163840
        # 测试完整消息边界保持二百五十六 KiB。
        max-message-bytes: 262144
        # 测试创建阶段最多并发发布八个分块。
        publish-concurrency: 8
        # 测试每个分块最多并发派发十六条工作消息。
        work-dispatch-concurrency: 16
    # 测试管理员前端只允许本机显式 Origin。
    allowed-origins: https://localhost:3001
    # 测试 hCaptcha 配置全部为非生产假值。
    hcaptcha:
      # 测试 Site Key 只满足属性绑定。
      site-key: 10000000-ffff-ffff-ffff-000000000001
      # 测试 Secret Key 只满足属性绑定。
      secret-key: 0x0000000000000000000000000000000000000000
      # 测试响应只允许 localhost。
      allowed-hosts: localhost
      # 测试连接超时保持八秒。
      connect-timeout: 8s
      # 测试响应超时保持八秒。
      response-timeout: 8s
      # 测试挑战最大年龄保持两分钟。
      max-challenge-age: 2m
    # 测试管理员 Cookie 仍保持生产安全属性。
    cookies:
      # 测试使用 Host-only Cookie。
      domain: ""
      # 测试管理员 CSRF Cookie 与生产同样保持 Host-only。
      csrf-domain: ""
      # 测试管理员会话 Cookie。
      session:
        # 测试会话 Cookie 保持 Secure。
        secure: true
        # 测试会话 Cookie 保持 HttpOnly。
        http-only: true
        # 测试会话 Cookie 使用严格同站策略。
        same-site: Strict
        # 测试会话 Cookie 仅作用于管理员 API。
        path: /api/admin
      # 测试管理员 CSRF Cookie。
      csrf:
        # 测试 CSRF Cookie 保持 Secure。
        secure: true
        # 测试 CSRF Cookie 允许前端读取。
        http-only: false
        # 测试 CSRF Cookie 使用严格同站策略。
        same-site: Strict
        # 测试 CSRF Cookie 作用于根路径。
        path: /
      # 测试管理员注册 Flow Cookie。
      register-flow:
        # 测试注册 Flow Cookie 保持 Secure。
        secure: true
        # 测试注册 Flow Cookie 保持 HttpOnly。
        http-only: true
        # 测试注册 Flow Cookie 使用严格同站策略。
        same-site: Strict
        # 测试注册 Flow Cookie 仅作用于注册端点。
        path: /api/admin/auth/register
      # 测试管理员注册 CSRF Cookie。
      register-csrf:
        # 测试注册 CSRF Cookie 保持 Secure。
        secure: true
        # 测试注册 CSRF Cookie 允许前端读取。
        http-only: false
        # 测试注册 CSRF Cookie 使用严格同站策略。
        same-site: Strict
        # 测试注册 CSRF Cookie 允许根页面读取并复制到请求头。
        path: /
      # 测试管理员登录 Flow Cookie。
      login-flow:
        # 测试登录 Flow Cookie 保持 Secure。
        secure: true
        # 测试登录 Flow Cookie 保持 HttpOnly。
        http-only: true
        # 测试登录 Flow Cookie 使用严格同站策略。
        same-site: Strict
        # 测试登录 Flow Cookie 仅作用于登录端点。
        path: /api/admin/auth/login
      # 测试管理员登录 CSRF Cookie。
      login-csrf:
        # 测试登录 CSRF Cookie 保持 Secure。
        secure: true
        # 测试登录 CSRF Cookie 允许前端读取。
        http-only: false
        # 测试登录 CSRF Cookie 使用严格同站策略。
        same-site: Strict
        # 测试登录 CSRF Cookie 允许根页面读取并复制到请求头。
        path: /

  # 测试环境关闭本地 IP2Location BIN 读取，避免依赖开发机文件。
  phone-country:
    # 普通 Spring 上下文测试不加载本地 BIN。
    enabled: false
    # 测试路径仅用于满足属性绑定，不对应真实地理数据库。
    bin-path: disabled-test-ip2location.bin
    # 测试环境保持与生产默认值一致的八秒查询期限。
    lookup-timeout: 8s
    # 测试默认不信任任何反向代理转发头。
    trusted-proxy-ranges: ""

  # 普通测试环境关闭访问审计，避免连接 RabbitMQ 或依赖审计数据表。
  access-audit:
    # 单元与上下文测试默认不注册访问审计基础设施。
    enabled: false
    # 固定测试密钥仅用于属性完整性，不对应任何生产环境密钥。
    hmac-secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    # 测试保留期与生产默认值保持一致。
    retention: 30d
    # 测试批量大小保持在项目允许边界内。
    batch-size: 200
    # 测试批量等待时间使用固定五百毫秒。
    batch-timeout: 500ms
    # 测试数据库写入截止时间保持在 RabbitMQ ACK 超时之前。
    store-timeout-seconds: 15
    # 测试清理单批上限为一千条。
    cleanup-batch-size: 1000
    # 测试单轮最多清理五十批。
    cleanup-max-batches: 50

  # 测试登录限流与刷新会话配置使用明确的非生产值。
  auth-session:
    # 测试会话 HMAC 密钥由固定测试字节构造，不可用于生产。
    hmac-secret-base64: c2Vzc2lvbi10ZXN0LXNlY3JldC0wMTIzNDU2Nzg5YWJjZGVm
    # 测试固定 Refresh Token 使用三小时滑动空闲有效期。
    refresh-token-ttl: 3h
    # 测试单用户最多保留十个刷新会话。
    max-sessions-per-user: 10
    # 测试全部撤销操作最多处理一百个会话。
    absolute-revoke-bound: 100
    # 测试登录失败仅按设备统计，密码与验证码使用相互独立的失败桶。
    login-limit:
      # 测试设备失败计数窗口为固定五分钟。
      window: 5m
      # 测试前五次失败允许累计，第六次失败触发设备封禁。
      max-failures: 5
      # 测试封禁持续十五分钟。
      block-duration: 15m

  # 测试注册服务配置全部使用不可用于生产的固定假值。
  registration:
    # 测试 Redis Key 使用独立 test 环境段。
    environment: test
    # 测试 HMAC 密钥与生产无关且满足至少 32 字节要求。
    hmac-secret-base64: YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=
    # 测试注册流程仍保持固定 600 秒生命周期。
    flow-ttl: 600s
    # 测试冲突滑动窗口为五分钟。
    conflict-window: 5m
    # 测试第五次冲突后的封禁时长为两小时。
    conflict-block-duration: 2h
    # 测试验证码有效期为五分钟。
    code-ttl: 5m
    # 测试发送冷却时间为六十秒。
    send-cooldown: 60s
    # 测试每渠道最多发送五次，与注册状态机的固定安全边界保持一致。
    max-sends-per-channel: 5
    # 测试验证码最多允许五次错误尝试。
    max-code-attempts: 5
    # 测试 Turnstile 服务端配置。
    turnstile:
      # 使用 Cloudflare 文档中的非生产测试 Secret。
      secret-key: 1x0000000000000000000000000000000AA
      # 测试 Turnstile 仅允许 localhost hostname。
      allowed-hosts: localhost
    # 测试邮件投递配置。
    mail:
      # 测试发件地址不对应真实邮箱身份。
      from: no-reply@example.test
    # 测试验证码异步投递消息保护配置。
    delivery:
      # 测试 payload 加密密钥由固定 32 字节构造，不对应任何生产密钥。
      payload-key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # 测试供应商总保护时间与主配置一致，但 Mock 不会等待真实网络。
      provider-timeout: 25s
      # 测试 RabbitMQ 投递参数只用于属性绑定，不连接真实 Broker。
      rabbit:
        # 普通测试上下文关闭 RabbitMQ 投递基础设施，由 MockitoBean 提供 Publisher。
        enabled: false
        # 测试发布确认超时使用固定五秒。
        confirm-timeout: 5s
        # 测试邮箱消费者数量保持默认单消费者。
        email-consumers: 1
        # 测试短信消费者数量保持默认单消费者。
        sms-consumers: 1
    # 测试阿里云短信配置使用明确的非生产假值。
    sms:
      # 测试 AccessKey ID 不对应任何真实账号。
      access-key-id: test-access-key-id
      # 测试 AccessKey Secret 不对应任何真实账号。
      access-key-secret: test-access-key-secret
      # 测试短信签名不用于真实外发。
      sign-name: 测试签名
      # 测试短信模板编号不对应生产模板。
      template-code: SMS_TEST_TEMPLATE
